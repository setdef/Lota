# Lota on Windows (ADR 011): LÖVE's
# dependencies built from source at LÖVE's versions (tasks/windows_build.rb),
# LÖVE's engine, Lota's extension, and the test-only extension built with
# MinGW against RubyInstaller's UCRT Ruby, the extension's closure of
# DLLs checked, its DLLs shown to load from the gem's own directory and
# nowhere else, the precompiled gem built, and then Lota's tests run on
# Mesa's software OpenGL, as LÖVE's own Windows CI runs Lövetest. x64
# builds with MSYS2's UCRT64 environment (GCC), ARM64 with its CLANGARM64
# environment (clang), the toolchains RubyInstaller builds its Ruby with
# for each. The gate (bundle exec rake) does not run here: its Bundler
# would compile gems RubyInstaller's Ruby has no build of, and its other
# checks, RuboCop, Steep, clang-tidy, and the sanitizers among them, read
# the same sources on macOS and Linux; so the tests run file by file,
# without its Rake tasks (windows_checks.rb tests).
#
# ci.yml calls it for x64 and ARM64, and keeps each gem it builds for the
# delivery, fuse, and release jobs; prepush.yml calls it for x64 alone,
# as the pre-push tier's Windows job, which keeps no gem.

name: Windows

on:
  workflow_call:
    inputs:
      runner:
        description: The runner's label
        type: string
        required: true
      platform:
        description: The gem's platform, such as x64-mingw-ucrt
        type: string
        required: true
      msystem:
        description: MSYS2's environment for the toolchain RubyInstaller builds its Ruby with
        type: string
        required: true
      compiler:
        description: The toolchain's MSYS2 packages, for setup-msys2's pacboy
        type: string
        required: true
      mesa:
        description: MSYS2's Mesa package, where mesa-dist-win builds none for the platform
        type: string
        default: ""
      foreground_held:
        description: 1 where a window of the shell's holds the runner's foreground (test/lovetest/held_foreground.rb)
        type: string
        default: ""
      cc:
        description: The C compiler
        type: string
        required: true
      cxx:
        description: The C++ compiler
        type: string
        required: true
      ccache:
        description: ccache's directory
        type: string
        required: true
      upload_gem:
        description: Keep the gem as the artifact lota-PLATFORM
        type: boolean
        default: true
      ignore_failures:
        description: Go on past failing tests (ci.yml's ignore_gate_failures, never on a tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ inputs.ccache }}
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CC: ${{ inputs.cc }}
      CXX: ${{ inputs.cxx }}
    steps:
      # The runner's Git converts line endings, which would keep
      # physics.patch from applying to LÖVE's sources.
      - name: Keep line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch LÖVE's sources
        shell: pwsh
        run: git submodule update --init --depth 1 vendor/love

      # RubyInstaller's Ruby, built with MinGW against the UCRT.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: head
          windows-toolchain: none
          # RubyInstaller's head build loads its zlib, OpenSSL, libffi,
          # and libyaml from MSYS2, which is set up below, so setup-ruby
          # installs no Bundler, whose gem install would need zlib.
          bundler: none

      # The toolchain alone: every library LÖVE links is built from source.
      # setup-msys2 caches the packages it installs, but downloads MSYS2's
      # base from GitHub's releases each time, and an outage of those
      # downloads outlasts its own two tries, so a failed attempt is tried
      # again two minutes later, whose failure alone fails the job. The
      # retry first removes what the failed attempt left, for setup-msys2
      # refuses to install over an MSYS2 directory that exists. setup-msys2
      # saves its package cache with paccache, which pacman-contrib
      # provides and the MSYS2 base does not always carry, so that is
      # installed: a missing command is a bug to fix, not an outage to retry.
      - id: msys2
        continue-on-error: true
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with: &msys2
          msystem: ${{ inputs.msystem }}
          path-type: inherit
          update: true
          install: patch make pacman-contrib
          pacboy: ${{ inputs.compiler }} cmake:p ninja:p ccache:p libyaml:p openssl:p libffi:p ${{ inputs.mesa }}
      - name: Wait before setting MSYS2 up again
        if: steps.msys2.outcome == 'failure'
        shell: pwsh
        run: |
          Start-Sleep -Seconds 120
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\msys64" -ErrorAction SilentlyContinue
      - if: steps.msys2.outcome == 'failure'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with: *msys2

      # RubyInstaller::Runtime finds MSYS2 through MSYS2_PATH, and adds its
      # MINGW bin directory to where Windows looks for DLLs, so the head
      # build's own extensions load.
      - name: Point RubyInstaller at setup-msys2's MSYS2
        shell: pwsh
        run: |
          "MSYS2_PATH=$env:RUNNER_TEMP\msys64" >> $env:GITHUB_ENV

      # The REUSE tool, at the version mise.toml pins, which checks the
      # gem's licensing as it is built (tasks/native_gem.rb), into the
      # runner's Python.
      - name: Install the REUSE tool
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "reuse[charset-normalizer]==6.2.0"

      - name: Report the toolchain and Ruby
        id: toolchain
        run: |
          set -x
          which $CC $CXX cmake ninja patch make ruby reuse strip
          $CXX --version
          cmake --version
          ruby -v
          ruby -e 'c = RbConfig::CONFIG; %w[arch host_os host_cpu DLEXT CC CXX libdir LIBRUBY].each { |k| puts "#{k}=#{c[k]}" }; puts "Gem::Platform.local=#{Gem::Platform.local}"'
          echo "compiler=$($CC --version | head -1 | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"

      # The archives and what they build, kept while the recipe and the
      # compiler stay the same (the stamp tasks/windows_build.rb checks).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dependencies
        with:
          path: |
            vendor/sources/windows
            tmp/dependencies/installdir
            tmp/dependencies/dependencies.stamp
          key: windows-dependencies-${{ inputs.platform }}-${{ steps.toolchain.outputs.compiler }}-${{ hashFiles('tasks/windows_build.rb', 'tasks/source_archive.rb') }}

      # Kept out of ccache, whose cache is the engine's and the extension's.
      - name: Build LÖVE's dependencies from source
        env:
          CMAKE_C_COMPILER_LAUNCHER: ""
          CMAKE_CXX_COMPILER_LAUNCHER: ""
        run: |
          start=$(date +%s)
          ruby -e 'require "./tasks/windows_build"
            build = WindowsBuild.new(sources: WindowsBuild::SOURCES, root: "tmp/dependencies")
            build.fetch
            build.dependencies'
          echo "dependencies ready in $(( $(date +%s) - start ))s"
          ls -l tmp/dependencies/installdir/lib tmp/dependencies/installdir/bin

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            vendor/sources/windows
            tmp/dependencies/installdir
            tmp/dependencies/dependencies.stamp
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Describe what OpenAL Soft compiled
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: ruby .github/windows_checks.rb notices tmp/dependencies/build/openal-soft-1.24.3 tmp/dependencies/src/openal-soft-1.24.3

      # sources_windows.cmake is LÖVE's CMake evaluated on Windows, as
      # rake engine:sources:check checks the other platforms' lists.
      - name: Check the engine's source list
        run: |
          ruby -e 'require "./tasks/engine_sources"
            commit = `git -C vendor/love rev-parse HEAD`.strip
            s = EngineSources.new(source: "vendor/love", build: "tmp/engine/sources/windows",
              cmake_args: EngineSources.cmake_args("windows"), label: EngineSources.label(commit, "windows"))
            problems = s.problems("ext/lota/engine/sources_windows.cmake")
            abort problems.join("\n") unless problems.empty?
            puts "ext/lota/engine/sources_windows.cmake matches vendor/love"'

      - name: Install Rice
        run: gem install rice -v 4.12.0 --no-document

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.ccache }}
          key: ccache-windows-${{ inputs.platform }}-${{ github.run_id }}
          restore-keys: ccache-windows-${{ inputs.platform }}-

      - name: Configure through extconf.rb
        run: |
          ccache --zero-stats
          mkdir -p tmp/ext
          cd tmp/ext
          ruby ../../ext/lota/extconf.rb "--with-cmake-build-dir=$(cygpath -m "$GITHUB_WORKSPACE/tmp/engine/build")" \
            --enable-native-test

      - name: Build the engine and the extension
        run: |
          start=$(date +%s)
          make -C tmp/ext install sitearchdir="$PWD/lib"
          echo "built in $(( $(date +%s) - start ))s"
          ccache --show-stats
          ls -l lib/lota/*.so lib/lota/libraries

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.ref_name == github.event.repository.default_branch
        with:
          path: ${{ inputs.ccache }}
          key: ccache-windows-${{ inputs.platform }}-${{ github.run_id }}

      - name: Check that Lota's code still warns as errors
        run: ruby .github/windows_checks.rb werror tmp/engine/build/compile_commands.json

      - name: Check the extension's DLLs
        run: ruby .github/windows_checks.rb closure lib/lota/native.so lib/lota/preload.so lib/lota/libraries/OpenAL32.dll

      # Each load runs with a PATH of only Ruby and Windows, as a player's
      # machine might have, and with a decoy OpenAL32.dll, a DLL of
      # Windows' own renamed, wherever a same-named DLL could be found:
      # first on PATH, in a directory RubyInstaller::Runtime.add_dll_directory
      # adds, and in each MSYS2 that RubyInstaller::Runtime.enable_msys_apps
      # could add, the one this job set up (which RubyInstaller finds
      # beside its Ruby) and the one installed on the runner (C:/msys64),
      # as a player's might be. A decoy that loaded would leave Lota without
      # OpenAL's functions. The decoys come out again, so the gem built
      # below cannot carry one.
      - name: Load Lota's DLLs from Lota's own directory
        timeout-minutes: 6
        run: |
          mkdir -p tmp/decoy
          cp /c/Windows/System32/version.dll tmp/decoy/OpenAL32.dll
          clean="$(cygpath -u "$(dirname "$(which ruby)")"):/c/Windows/system32:/c/Windows"
          decoy=$(cygpath -w "$PWD/tmp/decoy")
          decoys=()
          for msys in "$MINGW_PREFIX/bin" /c/msys64/ucrt64/bin /c/msys64/clangarm64/bin /c/msys64/mingw64/bin; do
            [ -d "$msys" ] && cp /c/Windows/System32/version.dll "$msys/OpenAL32.dll" && decoys+=("$msys/OpenAL32.dll") && echo "decoy in $msys"
          done
          echo "== with Lota's preloader"
          PATH="$PWD/tmp/decoy:$clean" /usr/bin/timeout -k 5 120 ruby .github/windows_checks.rb load preload "$decoy"
          echo "== without it, as a control: the decoy alone answers for OpenAL32.dll"
          status=0
          PATH="$PWD/tmp/decoy:$clean" /usr/bin/timeout -k 5 120 ruby .github/windows_checks.rb load bare "$decoy" || status=$?
          rm -rf tmp/decoy "${decoys[@]}"
          [ "$status" = 3 ] || { echo "the control exited $status, not 3"; exit 1; }

      # A restart replaces the process with lota run again; on Windows,
      # Ruby's exec starts it as a new process (windows_checks.rb).
      - name: Restart a game
        timeout-minutes: 4
        run: |
          clean="$(cygpath -u "$(dirname "$(which ruby)")"):/c/Windows/system32:/c/Windows"
          PATH="$clean" /usr/bin/timeout -k 5 180 ruby .github/windows_checks.rb restart

      # A window with OpenGL: Windows' own opengl32.dll gives the runner
      # OpenGL 1.1, which the engine refuses, so this shows that SDL could
      # make an OpenGL context on each architecture, not that a game draws.
      - name: Open a window with OpenGL
        timeout-minutes: 4
        run: |
          clean="$(cygpath -u "$(dirname "$(which ruby)")"):/c/Windows/system32:/c/Windows"
          PATH="$clean" /usr/bin/timeout -k 5 180 ruby .github/windows_checks.rb opengl

      # The gem's SHA-256 travels with it, as on the other platforms. The
      # package check builds it from what this job built, with the gem's
      # REUSE record checked, and its binaries read for the DLLs they
      # import (NativeFormat::PE), without Bundler (windows_checks.rb).
      - name: Build the precompiled gem
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          ruby .github/windows_checks.rb package
          cd pkg
          for gem in lota-*-"$PLATFORM".gem; do sha256sum "$gem" > "$gem.sha256"; cat "$gem.sha256"; ls -l "$gem"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.upload_gem
        with:
          name: lota-${{ inputs.platform }}
          path: pkg/lota-*-${{ inputs.platform }}.gem*
          if-no-files-found: error
          retention-days: 14

      # The tests draw, and a runner has no GPU, and Windows' own OpenGL is
      # 1.1, which LÖVE's renderer refuses. LÖVE's own Windows CI runs
      # Lövetest on Mesa's software OpenGL, llvmpipe, from mesa-dist-win's
      # release 24.2.4 (vendor/love/.github/workflows/main.yml, the Windows
      # job's "Install Mesa"), on x64 alone, since mesa-dist-win builds for
      # no ARM64. So x64 takes that release, checked by its SHA-256, and
      # ARM64 MSYS2's CLANGARM64 build of Mesa. Either goes beside Ruby's
      # program, where Windows finds it before System32's for the
      # opengl32.dll SDL loads by name (windows_checks.rb mesa), rather than
      # into System32, as LÖVE's does, and only after the gem is built, so
      # nothing of it reaches the gem.
      - name: Put Mesa's OpenGL beside Ruby
        env:
          MESA_DIST_WIN: https://github.com/pal1000/mesa-dist-win/releases/download/24.2.4/mesa3d-24.2.4-release-msvc.7z
          MESA_SHA256: e3919de795bee231edc88e9c996f2c1851250dff3bc9b51b9121760ae2250db0
        run: |
          if [ "$MSYSTEM" = CLANGARM64 ]; then
            ruby .github/windows_checks.rb mesa "$(cygpath -m "$MINGW_PREFIX/bin")"
          else
            curl --fail --location --silent --show-error --retry 5 -o "$RUNNER_TEMP/mesa.7z" "$MESA_DIST_WIN"
            (cd "$RUNNER_TEMP" && echo "$MESA_SHA256  mesa.7z" | sha256sum --check -)
            7z x -y -o"$(cygpath -w "$RUNNER_TEMP/mesa")" "$(cygpath -w "$RUNNER_TEMP/mesa.7z")" > /dev/null
            ls "$RUNNER_TEMP/mesa/x64"
            ruby .github/windows_checks.rb mesa "$(cygpath -m "$RUNNER_TEMP/mesa/x64")"
          fi

      # What the tests need beside Ruby's own gems: Minitest, and the
      # desktop input lock, from its tag, as the Gemfile takes it.
      - name: Install the tests' gems
        run: |
          gem install minitest -v '~> 6.0' --no-document
          git clone --quiet --depth 1 --branch v0.2.0 https://github.com/setdef/DesktopInputLock.git "$RUNNER_TEMP/desktop_input_lock"
          (cd "$RUNNER_TEMP/desktop_input_lock" && gem build --quiet ./*.gemspec && gem install --local --no-document ./*.gem)

      # Lota's tests, each file in a Ruby of its own, as rake test runs
      # them, with a PATH of Ruby, Windows, Windows PowerShell, which the
      # desktop input lock speaks through, Git for Windows' commands, since
      # the gemspec the version test loads lists its files with git, and,
      # last, MSYS2's, for the compiler and the tools some tests run.
      # RubyInstaller has Windows look for a DLL in Ruby's directories, those
      # it adds, and System32 alone (SetDefaultDllDirectories), never on
      # PATH, so no DLL there can answer for one of Lota's. GALLIUM_DRIVER
      # chooses llvmpipe, as Fledge's Windows trial drew with it. A dry run
      # may go on past a failing test, but never on a tag (the
      # ignore_failures input, from ci.yml's ignore_gate_failures).
      - name: Run the tests
        timeout-minutes: 100
        continue-on-error: ${{ inputs.ignore_failures }}
        env:
          GALLIUM_DRIVER: llvmpipe
          # llvmpipe's linear rasterizer, from Mesa 25, reads the wrong uniform array and matrix elements.
          LP_PERF: no_rast_linear
          LOTA_FOREGROUND_HELD: ${{ inputs.foreground_held }}
        run: |
          clean="$(cygpath -u "$(dirname "$(which ruby)")"):/c/Windows/system32:/c/Windows:/c/Windows/System32/WindowsPowerShell/v1.0:/c/Program Files/Git/cmd"
          PATH="$clean:$MINGW_PREFIX/bin" ruby .github/windows_checks.rb tests tmp/windows-tests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-tests-${{ inputs.platform }}
          path: tmp/windows-tests
          if-no-files-found: ignore
          retention-days: 14

