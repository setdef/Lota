# The MinGW spike (ADR 002, section 4): can LÖVE's engine and Lota's
# extension build with MinGW against RubyInstaller's UCRT Ruby, the Ruby
# Fledge ships on Windows? Runs only on the spike's branch, which never
# merges.

name: MinGW spike

on:
  push:
    branches:
      - spike/mingw
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: x64-mingw-ucrt
            msystem: UCRT64
            compiler: gcc:p
            cc: gcc
            cxx: g++
            ccache: D:/ccache
          # RubyInstaller's ARM64 Ruby is built with MSYS2's CLANGARM64
          # environment, which has no GCC.
          - runner: windows-11-arm
            platform: aarch64-mingw-ucrt
            msystem: CLANGARM64
            compiler: clang:p
            cc: clang
            cxx: clang++
            ccache: C:/ccache
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ matrix.ccache }}
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      # The runner's Git converts line endings, which would keep
      # physics.patch from applying to LÖVE's sources.
      - name: Keep line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch LÖVE's sources
        shell: pwsh
        run: git submodule update --init --depth 1 vendor/love

      # RubyInstaller's Ruby, built with MinGW against the UCRT.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "4.0"
          windows-toolchain: none

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          install: patch
          pacboy: >-
            ${{ matrix.compiler }} cmake:p ninja:p ccache:p
            sdl3:p openal:p freetype:p harfbuzz:p libvorbis:p libogg:p
            libtheora:p libmodplug:p zlib:p

      - name: Report the toolchain and Ruby
        run: |
          set -x
          which $CC $CXX cmake ninja patch ruby
          $CXX --version
          cmake --version
          ruby -v
          ruby -e 'c = RbConfig::CONFIG; %w[arch host_os target_os DLEXT CC CXX libdir LIBRUBY prefix].each { |k| puts "#{k}=#{c[k]}" }'
          gem env
          pacman -Q | grep -Ei 'gcc|sdl3|openal|freetype|harfbuzz|vorbis|ogg|theora|modplug|zlib|cmake|ninja|brotli|graphite|glib|bzip2|png'

      - name: Evaluate LÖVE's source list on Windows
        continue-on-error: true
        run: |
          mkdir -p tmp
          ruby -e 'require "./tasks/engine_sources"
            s = EngineSources.new(source: "vendor/love", build: "tmp/engine/sources/windows",
              cmake_args: EngineSources.cmake_args("windows"), label: "vendor/love on windows")
            File.binwrite("tmp/sources_windows.generated.cmake", s.generate)'
          grep -v '^#   vendor/love' ext/lota/engine/sources_windows.cmake > tmp/committed.cmake
          grep -v '^#   vendor/love' tmp/sources_windows.generated.cmake > tmp/generated.cmake
          diff tmp/committed.cmake tmp/generated.cmake && echo "the committed list matches"

      - name: Install Rice
        run: gem install rice -v 4.12.0 --no-document

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.ccache }}
          key: ccache-mingw-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache-mingw-${{ matrix.platform }}-

      - name: Configure through extconf.rb
        run: |
          ccache --zero-stats
          mkdir -p tmp/ext
          cd tmp/ext
          ruby ../../ext/lota/extconf.rb "--with-cmake-build-dir=$(cygpath -m "$GITHUB_WORKSPACE/tmp/engine/build")"

      - name: Build the engine
        id: engine
        continue-on-error: true
        run: |
          start=$(date +%s)
          set -o pipefail
          cmake --build tmp/engine/build --target lota_engine -- -k 0 2>&1 | tee tmp/engine.log
          echo "engine built in $(( $(date +%s) - start ))s"

      - name: Build the extension
        id: native
        continue-on-error: true
        run: |
          start=$(date +%s)
          set -o pipefail
          cmake --build tmp/engine/build --target lota_native -- -k 0 2>&1 | tee tmp/native.log
          echo "extension built in $(( $(date +%s) - start ))s"

      - name: Summarize the errors
        if: always()
        run: |
          for log in tmp/engine.log tmp/native.log; do
            [ -f "$log" ] || continue
            echo "== $log"
            grep -E 'error:|FAILED:|undefined reference|multiple definition' "$log" | sort | uniq -c | sort -rn | head -150 || true
          done
          ccache --show-stats || true

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ${{ matrix.ccache }}
          key: ccache-mingw-${{ matrix.platform }}-${{ github.run_id }}

      - name: Inspect the extension
        id: inspect
        if: steps.native.outcome == 'success'
        run: |
          so=tmp/engine/build/lib/lota/native.so
          objdump=$(command -v objdump || command -v llvm-objdump)
          ls -l "$so"
          echo "exports:"
          "$objdump" -p "$so" | sed -n '/Export Address Table/,/^$/p;/\[Ordinal\/Name Pointer\] Table/,/^$/p' | head -20
          echo "imports of native.so itself:"
          "$objdump" -p "$so" | sed -n 's/^\s*DLL Name: //p'
          cp "$so" lib/lota/native.so
          # Every DLL the extension loads, and theirs, that is not Windows',
          # copied to tmp/dlls.
          prefix="$MINGW_PREFIX/bin"
          mkdir -p tmp/dlls
          seen=""
          queue="$so"
          while [ -n "$queue" ]; do
            set -- $queue; file=$1; shift; queue="$*"
            for dll in $("$objdump" -p "$file" | sed -n 's/^\s*DLL Name: //p'); do
              case " $seen " in *" $dll "*) continue ;; esac
              seen="$seen $dll"
              if [ -f "$prefix/$dll" ]; then
                echo "MSYS2 $dll $(stat -c %s "$prefix/$dll") (needed by $(basename "$file"))"
                cp "$prefix/$dll" tmp/dlls/
                queue="$queue $prefix/$dll"
              else
                echo "system $dll"
              fi
            done
          done
          du -sh tmp/dlls
          # Lota's lib with the DLLs beside the extension.
          mkdir -p tmp/samedir
          cp -r lib tmp/samedir/lib
          cp tmp/dlls/*.dll tmp/samedir/lib/lota/

      # Each load runs with a PATH of only Ruby and Windows, as a player's
      # machine might have, so MSYS2's bin cannot answer the search.
      - name: Load Lota with nothing on the DLL search path
        if: steps.inspect.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          clean="$(dirname "$(which ruby)"):/c/Windows/system32:/c/Windows"
          SPIKE_GROUPS=core PATH="$clean" /usr/bin/timeout -k 5 120 ruby .github/mingw_spike_smoke.rb bare
          echo "=== exit status $?"

      - name: Load Lota with its DLLs beside the extension
        if: steps.inspect.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          clean="$(dirname "$(which ruby)"):/c/Windows/system32:/c/Windows"
          SPIKE_GROUPS=core PATH="$clean" /usr/bin/timeout -k 5 120 ruby .github/mingw_spike_smoke.rb bare "" tmp/samedir/lib
          echo "=== exit status $?"

      # The last run hung at exit after every check passed, so each group
      # of modules runs alone, under a timeout.
      - name: Load Lota with its DLLs' directory added
        if: steps.inspect.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          clean="$(dirname "$(which ruby)"):/c/Windows/system32:/c/Windows"
          dlls=$(cygpath -w "$PWD/tmp/dlls")
          for groups in "core" "core sdl" "core audio" "core sdl audio"; do
            echo "=== SPIKE_GROUPS=$groups"
            start=$(date +%s)
            status=0
            SPIKE_GROUPS="$groups" PATH="$clean" /usr/bin/timeout -k 5 120 ruby .github/mingw_spike_smoke.rb add-dll-directory "$dlls" || status=$?
            echo "=== exit status $status after $(( $(date +%s) - start ))s (124 is the timeout)"
          done

      # The test files that open no window and need neither the test-only
      # extension (ext/lota/native_test, which is POSIX-only) nor a GPU,
      # each run alone, with MSYS2's bin on PATH for the DLLs.
      - name: Run the headless tests
        if: steps.inspect.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          gem install minitest -v '~> 6.0' --no-document
          status=0
          for test in test/version_test.rb test/info_test.rb test/error_message_test.rb test/settings_test.rb \
            test/record_test.rb test/deprecation_test.rb test/boot_test.rb test/callbacks_test.rb; do
            echo "== $test"
            RUBY_DLL_PATH="$(cygpath -w "$MINGW_PREFIX/bin")" /usr/bin/timeout -k 5 120 ruby -Ilib -Itest "$test" 2>&1 | tail -15 || status=1
          done
          exit $status

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mingw-spike-${{ matrix.platform }}
          path: |
            tmp/*.log
            tmp/sources_windows.generated.cmake
            tmp/engine/build/lib/lota/native.so
            tmp/engine/build/lib/lota/native.map
          if-no-files-found: ignore
          retention-days: 7
