# Trunk's automatic revert (bin/auto-revert, tasks/auto_revert.rb,
# doc/contributors/ci.md), the backstop for a commit the pre-push checks
# let through. It acts on the full run, which holds every commit pushed
# since the run before it, and on the pre-push tier, which runs each
# commit once, so a commit the tier finds broken is reverted alone within
# minutes. A red run has its failed jobs run again once, to rule out a
# flaky test, unless it is a full run and a newer one is already going,
# behind which the rerun would wait to be cancelled; when they fail
# again, or the newer run would have cancelled the rerun, every commit
# since the last one whose run passed is reverted in one commit, pushed
# to trunk without force. A red tier run waits for the verdict of the
# commit before it that has a run of its own, and when that run passes
# it hands the red one back to be judged, which is why this also starts
# on the tier's passing runs. The revert commit is the notice: its
# message names the red run, the jobs that failed twice, and each
# reverted commit with its author, and this run's summary repeats it. It
# opens no issue and writes no comment. A revert is never reverted, nor
# is CI's release bookkeeping; a run where only the release's jobs
# failed, or only the tier's check that each new test failed first, is
# reported, not reverted; nothing is reverted when trunk already holds a
# fix; and a revert whose push loses to a revert of its commits stops. A
# push GitHub's token makes starts no workflow, so it starts CI and the
# pre-push tier on the revert by hand.
#
# Run by hand with a run's id, it does the same for that run, on any
# branch: as a dry run, which starts no run on the revert, it rehearses
# the revert on a branch.

name: Revert a red trunk

on:
  # Every full run and tier run on trunk that ends, whose job below goes
  # on only for a red one, or a tier run that passed. GitHub starts it
  # from trunk's copy of this file.
  workflow_run:
    workflows: [CI, Pre-push tier]
    types: [completed]
    branches: [trunk]
  workflow_dispatch:
    inputs:
      run_id:
        description: The red run to act on
        type: string
        required: true
      dry_run:
        description: Start no run on the revert (on a branch other than trunk, required)
        type: boolean
        default: true

permissions:
  contents: read

# No concurrency group: in one, a run waiting for its turn is cancelled
# when another starts, and with a run for every tier run that ends, the
# verdict of a red one would be lost to a green one's. Two runs can act at
# once instead: each pushes without force, and one whose push loses to a
# revert of its commits stops.

defaults:
  run:
    shell: bash

jobs:
  revert:
    name: Revert what broke the branch
    if: >-
      github.repository == 'setdef/Lota'
      && (github.event_name == 'workflow_dispatch'
        || github.event.workflow_run.conclusion == 'failure'
        || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Pre-push tier'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # To push the revert, and to run the failed jobs again and start the
    # runs on the revert.
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      # The whole history, which the revert reads back to the last green
      # commit, with the token kept for the push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The Ruby mise.toml pins; bin/auto-revert needs no bundle.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - name: Act on the red run
        run: |
          options=()
          if [ "$DRY_RUN" = true ]; then
            options+=(--dry-run)
          fi
          status=0
          bin/auto-revert "${options[@]}" "$RUN_ID" > "$RUNNER_TEMP/said" || status=$?
          cat "$RUNNER_TEMP/said"
          {
            echo '```'
            cat "$RUNNER_TEMP/said"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
