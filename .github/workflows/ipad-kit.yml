# The iPad playtest kit, on experiment/ipad-* branches only: Dot Popper,
# at the ref given, built with fledge build ios (Fledge 0.4.0, SDL's iOS
# host from ipad/host/ios, Lota from this checkout as a path gem), as the
# iOS spike built its game. The Xcode project it writes is zipped with its
# symbolic links and uploaded; a second, fresh runner without Lota,
# Fledge, or XcodeGen unpacks that zip and builds it for the Simulator
# and, unsigned, for devices, then runs the game in iPad Simulators and
# keeps the screenshots, the os_log, and the app's data container.
name: iPad kit

on:
  push:
    branches:
      - "experiment/ipad-*"
  workflow_dispatch:
    inputs:
      dot_popper_ref:
        description: Dot Popper's tag, branch, or commit (github.com/Kerrick/dot_popper)
        type: string
        default: v0.8.1
      project_run:
        description: Check the dot-popper-ios-project artifact of this earlier run instead of building one (empty to build)
        type: string
        default: ""
      identifier:
        description: The app's bundle identifier
        type: string
        default: com.kerricklong.DotPopper

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  MISE_DISABLE_TOOLS: ruby,rust
  DOT_POPPER_REF: ${{ inputs.dot_popper_ref || 'v0.8.1' }}
  APP_IDENTIFIER: ${{ inputs.identifier || 'com.kerricklong.DotPopper' }}
  APP_NAME: DotPopper

jobs:
  project:
    name: Dot Popper's Xcode project
    if: ${{ !inputs.project_run }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: cmake ninja

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          cmake --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Install the bundle
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/lota/bundle" >> "$GITHUB_ENV"
          BUNDLE_PATH=$HOME/.cache/lota/bundle bundle install

      - name: Build SDL3 for iOS
        run: bundle exec rake ios:sdl3

      - name: Check out Dot Popper and lay the iPad kit over it
        run: |
          game=$RUNNER_TEMP/dot_popper
          git clone --quiet https://github.com/Kerrick/dot_popper.git "$game"
          git -C "$game" -c advice.detachedHead=false checkout --quiet "$DOT_POPPER_REF"
          echo "Dot Popper $DOT_POPPER_REF is $(git -C "$game" rev-parse HEAD)"
          version=$(ruby -ryaml -e 'print YAML.load_file(ARGV[0]).fetch("version")' "$game/fledge.yml")
          echo "DOT_POPPER_VERSION=$version" >> "$GITHUB_ENV"
          echo "DOT_POPPER_SHA=$(git -C "$game" rev-parse HEAD)" >> "$GITHUB_ENV"
          # The desktop's precompiled Lota gems, its lockfile, and its Ruby
          # pins give way to Lota from this checkout and Fledge 0.4.0.
          rm -rf "$game/vendor/cache" "$game/Gemfile.lock" "$game/mise.toml" "$game/.ruby-version"
          mkdir -p "$game/host"
          cp -R ipad/host/ios "$game/host/ios"
          cp ipad/ipad_kit "$game/bin/ipad_kit"
          cat > "$game/Gemfile" <<EOF
          # frozen_string_literal: true

          source "https://rubygems.org"

          gem "lota", path: "$GITHUB_WORKSPACE"
          gem "fledge", git: "https://github.com/setdef/Fledge", tag: "v0.4.0", group: :development
          EOF
          cat > "$game/fledge.yml" <<EOF
          # The iPad kit's fledge.yml for fledge build ios (Fledge 0.4.0): one
          # program, bin/ipad_kit, which runs bin/dot_popper (it boots the
          # game folder as a fused Lota game) and, only with
          # DOT_POPPER_KIT_PROBE=1, logs what Lota's window and sensors report; SDL's
          # iOS host in host/ios.
          name: $APP_NAME
          version: "$version"
          publisher: Kerrick Long
          copyright: © 2026 Kerrick Long
          programs:
            - path: bin/ipad_kit
              kind: windowed
              identifier: $APP_IDENTIFIER
              icon: icons/icon
          ios:
            host: host/ios
          EOF
          cat "$game/Gemfile" "$game/fledge.yml"

      - name: Build the app with fledge build ios
        run: |
          rice=$(bundle exec ruby -e 'print Gem.loaded_specs.fetch("rice").full_gem_path')
          cd "$RUNNER_TEMP/dot_popper"
          export LOTA_SOURCE=$GITHUB_WORKSPACE BUNDLE_GEMFILE=$PWD/Gemfile BUNDLE_PATH=$RUNNER_TEMP/app-bundle
          export XDG_CACHE_HOME=$RUNNER_TEMP/cache
          bundle config set --local build.lota \
            "--with-lota-source=$GITHUB_WORKSPACE --with-lota-sdl3=$GITHUB_WORKSPACE/tmp/ios/sdl3 --with-rice-dir=$rice"
          bundle lock --add-platform ruby
          bundle install
          bundle exec fledge --version
          time bundle exec fledge build ios
          ls -la "dist/$APP_NAME-ios"

      - name: Check that the project stands on its own
        run: |
          project=$RUNNER_TEMP/dot_popper/dist/$APP_NAME-ios
          # Nothing in what Xcode reads may point at this runner.
          if grep -rIl -e "$RUNNER_TEMP" -e "$GITHUB_WORKSPACE" -e /Users/runner \
              "$project/project.yml" "$project/$APP_NAME.xcodeproj" "$project/Host" "$project/fledge/fledge.cfg"; then
            echo "::error::the project names a path on this runner"; exit 1
          fi
          find "$project" -type l -exec ls -l {} + | head -40
          echo "symbolic links: $(find "$project" -type l | wc -l)"
          cp ipad/README.txt "$project/README.txt"
          {
            echo "Dot Popper $DOT_POPPER_REF ($DOT_POPPER_SHA), version $DOT_POPPER_VERSION"
            echo "Lota $GITHUB_SHA ($GITHUB_REF_NAME)"
            echo "Fledge 0.4.0"
            echo "Bundle identifier $APP_IDENTIFIER"
            echo "Built on $(sw_vers -productName) $(sw_vers -productVersion) with $(xcodebuild -version | tr '\n' ' ')"
            echo "XcodeGen $(xcodegen --version)"
            echo "Workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$project/BUILD-INFO.txt"
          cat "$project/BUILD-INFO.txt"
          # The one file the playtester fills in and sends back, with the
          # build it tests already named.
          {
            echo "  Dot Popper $DOT_POPPER_REF, commit $DOT_POPPER_SHA (version $DOT_POPPER_VERSION)"
            echo "  Lota $GITHUB_SHA ($GITHUB_REF_NAME)"
            echo "  Workflow run $GITHUB_RUN_ID, $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/build-lines.txt"
          ruby -e 'template, lines, out = ARGV; text = File.read(template)
            abort "no @BUILD@ in #{template}" unless text.include?("@BUILD@")
            File.write(out, text.sub("@BUILD@\n", File.read(lines)))' \
            ipad/ipad-results.txt "$RUNNER_TEMP/build-lines.txt" "$project/ipad-results.txt"
          cat "$project/ipad-results.txt"
          du -sh "$project"/*

      - name: Zip the project with its symbolic links
        run: |
          mkdir -p "$RUNNER_TEMP/kit"
          cd "$RUNNER_TEMP/dot_popper/dist"
          zip -qry "$RUNNER_TEMP/kit/$APP_NAME-ios.zip" "$APP_NAME-ios"
          cd "$RUNNER_TEMP/kit"
          shasum -a 256 "$APP_NAME-ios.zip" > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-popper-ios-project
          path: |
            ${{ runner.temp }}/kit/DotPopper-ios.zip
            ${{ runner.temp }}/kit/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  touch:
    name: Touch and rotation in an iPad Simulator (CI-only UI test)
    needs: project
    if: ${{ !cancelled() && (needs.project.result == 'success' || inputs.project_run) }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ipad
          path: lota

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dot-popper-ios-project
          path: ${{ runner.temp }}/download
          run-id: ${{ inputs.project_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Select the newest Xcode and install XcodeGen
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          brew install xcodegen

      # A copy of the kit's project with a UI test target, which the zip
      # never holds: its runner is a second app, with a second App ID.
      - name: Add the UI test to a copy of the project
        run: |
          cd "$RUNNER_TEMP/download"
          shasum -a 256 -c SHA256SUMS
          ditto -x -k "$APP_NAME-ios.zip" "$RUNNER_TEMP/touch"
          project=$RUNNER_TEMP/touch/$APP_NAME-ios
          mkdir -p "$project/UITests"
          cp "$GITHUB_WORKSPACE/lota/ipad/uitests/TouchTest.m" "$project/UITests/"
          ruby -ryaml -e '
            path, name, id = ARGV
            spec = YAML.load_file(path)
            spec["targets"]["#{name}UITests"] = {
              "type" => "bundle.ui-testing", "platform" => "iOS", "sources" => [{ "path" => "UITests" }],
              "dependencies" => [{ "target" => name }],
              "settings" => { "base" => { "GENERATE_INFOPLIST_FILE" => true, "TEST_TARGET_NAME" => name,
                "PRODUCT_BUNDLE_IDENTIFIER" => "#{id}UITests", "CLANG_ENABLE_MODULES" => true, "OTHER_LDFLAGS" => "" } }
            }
            spec["targets"][name]["scheme"] = { "testTargets" => ["#{name}UITests"] }
            File.write(path, YAML.dump(spec))
          ' "$project/project.yml" "$APP_NAME" "$APP_IDENTIFIER"
          xcodegen generate --spec "$project/project.yml" --project "$project"

      - name: Tap and rotate Dot Popper
        run: |
          project=$RUNNER_TEMP/touch/$APP_NAME-ios
          mkdir -p "$RUNNER_TEMP/touch-shots"
          runtime=$(xcrun simctl list runtimes -j | ruby -rjson -e 'puts JSON.parse($stdin.read)["runtimes"].select { |r| r["platform"] == "iOS" && r["isAvailable"] }.max_by { |r| Gem::Version.new(r["version"]) }["identifier"]')
          udid=$(xcrun simctl create dot-popper-touch "iPad Pro 13-inch (M5)" "$runtime")
          xcrun simctl bootstatus "$udid" -b > /dev/null
          since=$(date "+%Y-%m-%d %H:%M:%S")
          TEST_RUNNER_KIT_SHOTS=$RUNNER_TEMP/touch-shots xcodebuild test -project "$project/$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" -destination "id=$udid" -derivedDataPath "$RUNNER_TEMP/touch-derived" \
            -resultBundlePath "$RUNNER_TEMP/touch-shots/TouchTest.xcresult" CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/touch-shots/xcodebuild-test.log" 2>&1 || status=$?
          grep -E "Test Case|error|TEST|passed|failed" "$RUNNER_TEMP/touch-shots/xcodebuild-test.log" | tail -40
          xcrun simctl spawn "$udid" log show --start "$since" --style compact --info \
            --predicate "subsystem == \"$APP_IDENTIFIER\" OR process == \"$APP_NAME\"" > "$RUNNER_TEMP/touch-shots/app.log" 2>&1 || true
          grep -v "^Filtering" "$RUNNER_TEMP/touch-shots/app.log" | tail -60
          data=$(xcrun simctl get_app_container "$udid" "$APP_IDENTIFIER" data 2>/dev/null) && cp -R "$data" "$RUNNER_TEMP/touch-shots/data-container"
          find "$RUNNER_TEMP/touch-shots" -maxdepth 4 -type f -not -path "*xcresult*" | sort
          cp ~/Library/Logs/DiagnosticReports/"$APP_NAME"* "$RUNNER_TEMP/touch-shots/" 2>/dev/null || true
          exit "${status:-0}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dot-popper-ipad-touch
          path: ${{ runner.temp }}/touch-shots
          retention-days: 30

  verify:
    name: Build the project on a fresh Mac and run it in iPad Simulators
    needs: project
    if: ${{ !cancelled() && (needs.project.result == 'success' || inputs.project_run) }}
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      # Only the kit's harness; no Lota, no bundle, no submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ipad
          path: lota

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dot-popper-ios-project
          path: ${{ runner.temp }}/download
          run-id: ${{ inputs.project_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun simctl list runtimes
          command -v xcodegen || echo "no xcodegen on this runner"
          gem list -i lota || echo "no lota gem on this runner"
          gem list -i fledge || echo "no fledge gem on this runner"

      - name: Check and unpack the artifact
        run: |
          cd "$RUNNER_TEMP/download"
          shasum -a 256 -c SHA256SUMS
          ls -la
          mkdir -p "$RUNNER_TEMP/unpacked"
          ditto -x -k "$APP_NAME-ios.zip" "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked/$APP_NAME-ios"
          ls -la
          echo "symbolic links: $(find . -type l | wc -l)"
          cat BUILD-INFO.txt

      - name: Build for the Simulator and, unsigned, for devices
        run: |
          cd "$RUNNER_TEMP/unpacked/$APP_NAME-ios"
          xcodebuild -list -project "$APP_NAME.xcodeproj"
          for build in "Debug iphonesimulator" "Debug iphoneos" "Release iphoneos"; do
            set -- $build
            log=$RUNNER_TEMP/logs/xcodebuild-$1-$2.log
            mkdir -p "$RUNNER_TEMP/logs"
            xcodebuild -project "$APP_NAME.xcodeproj" -scheme "$APP_NAME" -configuration "$1" -sdk "$2" \
              -derivedDataPath "$RUNNER_TEMP/derived" build CODE_SIGNING_ALLOWED=NO > "$log" 2>&1 \
              || { tail -80 "$log"; exit 1; }
            grep -E "warning:|error:|BUILD" "$log" | sort | uniq -c | head -40
          done
          for app in "$RUNNER_TEMP"/derived/Build/Products/*/"$APP_NAME.app"; do
            echo "== $app"
            plutil -p "$app/Info.plist"
            xcrun vtool -show-build "$app/$APP_NAME" | head -12
            ls "$app"
            du -sh "$app"
          done

      - name: Run Dot Popper in iPad Simulators
        run: |
          app=$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/$APP_NAME.app
          KIT_REPEATS=3 /usr/bin/ruby lota/ipad/simulator.rb "$app" "$APP_IDENTIFIER" "$APP_NAME" "$RUNNER_TEMP/simulator" \
            "iPad Pro 13-inch (M5)" "iPad (A16)" "iPad mini (A17 Pro)"

      - name: Zip the Simulator app
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/simapp"
          cd "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator"
          ditto -c -k --keepParent "$APP_NAME.app" "$RUNNER_TEMP/simapp/$APP_NAME-simulator.app.zip"
          cd "$RUNNER_TEMP/simapp"
          shasum -a 256 ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dot-popper-ipad-simulator
          path: |
            ${{ runner.temp }}/simulator
            ${{ runner.temp }}/simapp
            ${{ runner.temp }}/logs
          retention-days: 30
