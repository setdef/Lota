# The iOS kit, for any Lota game in a public repository: an Xcode project
# that builds the game as one app for iPhone and iPad, which a studio or
# a game's maintainer opens, signs with their own Apple ID or team, and
# owns (doc/contributors/plan/002.md, "Two ends of shipping a game";
# doc/contributors/ios-kit.md is the guide).
#
# The project job lays the game out as a Fledge project (ipad/prepare.rb:
# lota fuse's entry script, or the game's own program), with Lota from
# this checkout as a path gem and SDL's iOS host from the gem's
# ext/lota/phone/host/ios, and has fledge build ios (Fledge 0.6.0) write
# the Xcode project, which it
# zips with its symbolic links and uploads as the ios-kit artifact. A
# second, fresh runner without Lota, Fledge, or XcodeGen unpacks that zip,
# builds it for the Simulator and, unsigned, for devices, checks what the
# built app says (ipad/check_app.rb), and runs it in portrait in iPad and
# iPhone Simulators (ipad/simulator.rb). A third adds a UI test target to
# a copy of the project, which the kit never holds, and runs the same
# launches in landscape, then taps and turns the screen.
#
# Pushed to an experiment/ios-kit-* or experiment/phones-* branch, it
# builds Lota's own test/games/winkit from that commit. A game's own CI calls it as a
# reusable workflow (workflow_call), with lota_ref naming the same ref as
# its uses line; doc/contributors/ios-kit.md shows how.
name: iOS kit

on:
  push:
    branches:
      - "experiment/ios-kit-*"
      - "!experiment/ios-kit-call-*"
      - "experiment/phones-*"
  workflow_dispatch:
    inputs:
      game_repository:
        description: The public GitHub repository (OWNER/NAME) that holds the game
        type: string
        required: true
      game_ref:
        description: Its tag, branch, or commit (empty for its default branch)
        type: string
        default: ""
      game_path:
        description: The game's folder in the repository, the one with main.rb
        type: string
        default: "."
      display_name:
        description: The name under the app's icon, CFBundleDisplayName (empty for the repository's name)
        type: string
        default: ""
      app_name:
        description: The Xcode target's name, letters and digits (empty to derive it from display_name)
        type: string
        default: ""
      identifier:
        description: The bundle identifier, reverse-DNS (empty for com.example.APP_NAME)
        type: string
        default: ""
      program:
        description: The program Fledge runs, relative to game_path (empty to write one that boots the game fused, as lota fuse does)
        type: string
        default: ""
      icon:
        description: A folder, glob, or PNG in the repository holding the 1024-pixel icon, such as icons/icon-*.png (empty for a plain one)
        type: string
        default: ""
      orientations:
        description: "Orientations, such as 'iphone: portrait landscape; ipad: all' (empty for that)"
        type: string
        default: ""
      audio_category:
        description: The audio session's category
        type: choice
        options: [ambient, solo-ambient, playback, default]
        default: ambient
      hide_status_bar:
        description: Hide the status bar
        type: boolean
        default: true
      smoke_env:
        description: NAME=VALUE pairs, space-separated, for the Simulator's normal launches (CI only)
        type: string
        default: ""
      smoke_expect:
        description: A Ruby regular expression the game's output must match in a normal launch (empty for none)
        type: string
        default: ""
      smoke_seconds:
        description: How long a normal launch may run
        type: string
        default: "40"
      touch_env:
        description: NAME=VALUE pairs added to smoke_env for the touch test's launch (CI only)
        type: string
        default: ""
      extra_launches:
        description: More portrait launches, separated by ;, each with its own NAME=VALUE pairs (CI only)
        type: string
        default: ""
      kit_questions:
        description: A text file in the repository with the playtest's questions (empty for the kit's own)
        type: string
        default: ""
      project_run:
        description: Check the ios-kit artifact of this earlier run instead of building one (empty to build)
        type: string
        default: ""
      lota_ref:
        description: The ref of Lota to build with, the one the workflow's uses line names (empty for this run's commit)
        type: string
        default: ""

  workflow_call:
    inputs:
      lota_ref:
        description: The ref of Lota to build with, the one the workflow's uses line names, such as the tag in uses
        type: string
        required: true
      game_repository:
        description: The GitHub repository (OWNER/NAME) that holds the game, usually the caller's own
        type: string
        required: true
      game_ref:
        description: Its tag, branch, or commit (empty for its default branch)
        type: string
        default: ""
      game_path:
        description: The game's folder in the repository, the one with main.rb
        type: string
        default: "."
      display_name:
        description: The name under the app's icon, CFBundleDisplayName (empty for the repository's name)
        type: string
        default: ""
      app_name:
        description: The Xcode target's name, letters and digits (empty to derive it from display_name)
        type: string
        default: ""
      identifier:
        description: The bundle identifier, reverse-DNS (empty for com.example.APP_NAME)
        type: string
        default: ""
      program:
        description: The program Fledge runs, relative to game_path (empty to write one that boots the game fused, as lota fuse does)
        type: string
        default: ""
      icon:
        description: A folder, glob, or PNG in the repository holding the 1024-pixel icon, such as icons/icon-*.png (empty for a plain one)
        type: string
        default: ""
      orientations:
        description: "Orientations, such as 'iphone: portrait landscape; ipad: all' (empty for that)"
        type: string
        default: ""
      audio_category:
        description: The audio session's category
        type: string
        default: ambient
      hide_status_bar:
        description: Hide the status bar
        type: boolean
        default: true
      smoke_env:
        description: NAME=VALUE pairs, space-separated, for the Simulator's normal launches (CI only)
        type: string
        default: ""
      smoke_expect:
        description: A Ruby regular expression the game's output must match in a normal launch (empty for none)
        type: string
        default: ""
      smoke_seconds:
        description: How long a normal launch may run
        type: string
        default: "40"
      touch_env:
        description: NAME=VALUE pairs added to smoke_env for the touch test's launch (CI only)
        type: string
        default: ""
      extra_launches:
        description: More portrait launches, separated by ;, each with its own NAME=VALUE pairs (CI only)
        type: string
        default: ""
      kit_questions:
        description: A text file in the repository with the playtest's questions (empty for the kit's own)
        type: string
        default: ""
      project_run:
        description: Check the ios-kit artifact of this earlier run instead of building one (empty to build)
        type: string
        default: ""

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  MISE_DISABLE_TOOLS: ruby,rust
  FLEDGE_REF: v0.6.0
  # Pushed, the workflow checks winkit, which prints what Lota sees and
  # quits with 0 after its WINKIT_SECONDS; its touch launch runs the DPI
  # probe (test/games/winkit/main.rb).
  # Run by a game's own CI (workflow_call), github.repository and
  # github.sha are the game's, so Lota's checkout names its own.
  LOTA_REPOSITORY: setdef/Lota
  LOTA_REF: ${{ inputs.lota_ref || github.sha }}
  LOTA_REF_NAME: ${{ inputs.lota_ref || github.ref_name }}
  KIT_GAME_REPOSITORY: ${{ inputs.game_repository || github.repository }}
  KIT_GAME_REF: ${{ !inputs.game_repository && github.sha || inputs.game_ref }}
  KIT_GAME_PATH: ${{ !inputs.game_repository && 'test/games/winkit' || inputs.game_path }}
  KIT_DISPLAY_NAME: ${{ !inputs.game_repository && 'Winkit' || inputs.display_name }}
  KIT_APP_NAME: ${{ inputs.app_name }}
  KIT_IDENTIFIER: ${{ inputs.identifier }}
  KIT_PROGRAM: ${{ inputs.program }}
  KIT_ICON: ${{ inputs.icon }}
  KIT_ORIENTATIONS: ${{ inputs.orientations }}
  KIT_AUDIO_CATEGORY: ${{ inputs.audio_category || 'ambient' }}
  KIT_HIDE_STATUS_BAR: ${{ !inputs.game_repository || inputs.hide_status_bar }}
  KIT_QUESTIONS: ${{ inputs.kit_questions }}
  KIT_SMOKE_ENV: ${{ !inputs.game_repository && 'WINKIT_HIGHDPI=1' || inputs.smoke_env }}
  KIT_SMOKE_EXPECT: ${{ !inputs.game_repository && '(?m)^exiting with 0$' || inputs.smoke_expect }}
  KIT_SMOKE_SECONDS: ${{ inputs.smoke_seconds || '40' }}
  KIT_EXTRA_LAUNCHES: ${{ inputs.extra_launches }}
  KIT_TOUCH_ENV: ${{ !inputs.game_repository && 'WINKIT_DPI_PROBE=1 WINKIT_SECONDS=150' || inputs.touch_env }}
  KIT_DEVICES: >-
    iPad Pro 13-inch (M5)|iPad Pro 13-inch (M4);
    iPad (A16)|iPad (10th generation);
    iPad mini (A17 Pro)|iPad mini (6th generation);
    iPhone 17 Pro|iPhone 16 Pro;
    ?iPhone 16e|iPhone SE (3rd generation)
  KIT_TOUCH_DEVICES: iPad Pro 13-inch,iPhone 17 Pro,iPhone 16 Pro

jobs:
  project:
    name: The Xcode project
    if: ${{ !inputs.project_run }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LOTA_REPOSITORY }}
          ref: ${{ env.LOTA_REF }}
          persist-credentials: false
          submodules: true

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: cmake ninja

      - name: Select the newest Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          cmake --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Install the bundle
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/lota/bundle" >> "$GITHUB_ENV"
          BUNDLE_PATH=$HOME/.cache/lota/bundle bundle install

      - name: Build SDL3 for iOS
        run: bundle exec rake ios:sdl3

      # With the run's token, so a game's own CI checks out its own
      # repository even when it is private.
      - name: Check the game's repository name
        run: |
          if ! [[ $KIT_GAME_REPOSITORY =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::game_repository must be OWNER/NAME, not $KIT_GAME_REPOSITORY"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.KIT_GAME_REPOSITORY }}
          ref: ${{ env.KIT_GAME_REF }}
          persist-credentials: false
          path: kit-game

      - name: Move the game out of Lota's checkout
        run: |
          clone=$RUNNER_TEMP/game/${KIT_GAME_REPOSITORY#*/}
          mkdir -p "$(dirname "$clone")"
          mv kit-game "$clone"
          sha=$(git -C "$clone" rev-parse HEAD)
          echo "$KIT_GAME_REPOSITORY ${KIT_GAME_REF:-(default branch)} is $sha"
          { echo "KIT_GAME_CLONE=$clone"; echo "KIT_GAME_SHA=$sha"; } >> "$GITHUB_ENV"

      # A path gem carries its whole folder into the app, so the app gets a
      # folder of the files Lota's gem packages (lota.gemspec), made as
      # doc/guide/phones.md makes it, rather than this checkout, with its
      # submodules and builds. The extension still builds from the
      # checkout's vendor/love (--with-lota-source).
      - name: Lay out the project
        run: |
          mkdir -p tmp/phone
          gem build lota.gemspec --output tmp/phone/lota.gem
          gem unpack tmp/phone/lota.gem --target tmp/phone
          gem specification tmp/phone/lota.gem --ruby > tmp/phone/lota/lota.gemspec
          gem=$GITHUB_WORKSPACE/tmp/phone/lota
          du -sh "$gem"
          export KIT_LOTA_GEM=$gem KIT_FLEDGE_REF=$FLEDGE_REF KIT_PROJECT=$RUNNER_TEMP/project KIT_JSON=$RUNNER_TEMP/kit/kit.json
          KIT_LOTA_SHA=$(git rev-parse HEAD)
          export KIT_LOTA_SHA
          export KIT_LOTA_REPOSITORY=$LOTA_REPOSITORY KIT_LOTA_REF=$LOTA_REF_NAME KIT_RUN_ID=$GITHUB_RUN_ID KIT_RUN_REPOSITORY=$GITHUB_REPOSITORY
          export KIT_RUN_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          mkdir -p "$RUNNER_TEMP/kit"
          ruby ipad/prepare.rb layout
          echo "APP_NAME=$(ruby -rjson -e 'print JSON.parse(File.read(ARGV[0]))["app_name"]' "$KIT_JSON")" >> "$GITHUB_ENV"
          cd "$KIT_PROJECT"
          cat Gemfile fledge.yml
          find . -path ./game -prune -o -print | sort | head -60

      - name: Build the app with fledge build ios
        run: |
          rice=$(bundle exec ruby -e 'print Gem.loaded_specs.fetch("rice").full_gem_path')
          cd "$RUNNER_TEMP/project"
          export LOTA_SOURCE=$GITHUB_WORKSPACE BUNDLE_GEMFILE=$PWD/Gemfile BUNDLE_PATH=$RUNNER_TEMP/app-bundle
          export XDG_CACHE_HOME=$RUNNER_TEMP/cache
          bundle config set --local build.lota \
            "--with-lota-source=$GITHUB_WORKSPACE --with-lota-sdl3=$GITHUB_WORKSPACE/tmp/ios/sdl3 --with-rice-dir=$rice"
          bundle lock --add-platform ruby
          bundle install
          bundle exec fledge --version
          time bundle exec fledge build ios --out "$RUNNER_TEMP/dist"
          ls -la "$RUNNER_TEMP/dist/$APP_NAME-ios"

      - name: Check that the project stands on its own, and finish it
        run: |
          project=$RUNNER_TEMP/dist/$APP_NAME-ios
          # Nothing in what Xcode reads may point at this runner.
          if grep -rIl -e "$RUNNER_TEMP" -e "$GITHUB_WORKSPACE" -e /Users/runner \
              "$project/project.yml" "$project/$APP_NAME.xcodeproj" "$project/Host" "$project/fledge/fledge.cfg"; then
            echo "::error::the project names a path on this runner"; exit 1
          fi
          echo "symbolic links: $(find "$project" -type l | wc -l)"
          grep -n "APP_DISPLAY_NAME" "$project/project.yml" "$project/$APP_NAME.xcodeproj/project.pbxproj"
          export KIT_JSON=$RUNNER_TEMP/kit/kit.json
          # sed reads all of xcodebuild's output: head would close the pipe
          # early, and xcodebuild dies of the broken pipe (status 134),
          # which pipefail makes the step's.
          KIT_XCODE="$(xcodebuild -version | sed -n 1p)"
          export KIT_XCODE
          KIT_BUILT_WITH="Built on $(sw_vers -productName) $(sw_vers -productVersion) with $(xcodebuild -version | tr '\n' ' ')and XcodeGen $(xcodegen --version | sed 's/Version: //')"
          export KIT_BUILT_WITH
          ruby ipad/prepare.rb finish "$project"
          du -sh "$project"/*

      - name: Zip the project with its symbolic links
        run: |
          cd "$RUNNER_TEMP/dist"
          zip -qry "$RUNNER_TEMP/kit/$APP_NAME-ios.zip" "$APP_NAME-ios"
          cd "$RUNNER_TEMP/kit"
          shasum -a 256 "$APP_NAME-ios.zip" kit.json > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-kit
          path: ${{ runner.temp }}/kit
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Build the project on a fresh Mac and run it in portrait
    needs: project
    if: ${{ !cancelled() && (needs.project.result == 'success' || inputs.project_run) }}
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      # Only the kit's harness; no Lota, no bundle, no submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LOTA_REPOSITORY }}
          ref: ${{ env.LOTA_REF }}
          persist-credentials: false
          sparse-checkout: ipad
          path: lota

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-kit
          path: ${{ runner.temp }}/download
          run-id: ${{ inputs.project_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Select the newest Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun simctl list runtimes
          command -v xcodegen || echo "no xcodegen on this runner"
          gem list -i lota || echo "no lota gem on this runner"
          gem list -i fledge || echo "no fledge gem on this runner"

      - name: Check and unpack the artifact
        run: |
          cd "$RUNNER_TEMP/download"
          shasum -a 256 -c SHA256SUMS
          ls -la
          app_name=$(/usr/bin/ruby -rjson -e 'print JSON.parse(File.read("kit.json"))["app_name"]')
          identifier=$(/usr/bin/ruby -rjson -e 'print JSON.parse(File.read("kit.json"))["identifier"]')
          { echo "APP_NAME=$app_name"; echo "APP_IDENTIFIER=$identifier"; } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/unpacked"
          ditto -x -k "$app_name-ios.zip" "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked/$app_name-ios"
          ls -la
          echo "symbolic links: $(find . -type l | wc -l)"
          cat BUILD-INFO.txt

      - name: Build for the Simulator and, unsigned, for devices
        run: |
          cd "$RUNNER_TEMP/unpacked/$APP_NAME-ios"
          xcodebuild -list -project "$APP_NAME.xcodeproj"
          mkdir -p "$RUNNER_TEMP/logs"
          for build in "Debug iphonesimulator" "Debug iphoneos" "Release iphoneos"; do
            read -r configuration sdk <<< "$build"
            set -- "$configuration" "$sdk"
            log=$RUNNER_TEMP/logs/xcodebuild-$1-$2.log
            xcodebuild -project "$APP_NAME.xcodeproj" -scheme "$APP_NAME" -configuration "$1" -sdk "$2" \
              -derivedDataPath "$RUNNER_TEMP/derived" build CODE_SIGNING_ALLOWED=NO > "$log" 2>&1 \
              || { tail -80 "$log"; exit 1; }
            grep -E "warning:|error:|BUILD" "$log" | sort | uniq -c | head -40
          done
          for app in "$RUNNER_TEMP"/derived/Build/Products/*/"$APP_NAME.app"; do
            echo "== $app"
            plutil -p "$app/Info.plist"
            /usr/bin/ruby "$GITHUB_WORKSPACE/lota/ipad/check_app.rb" "$app" "$RUNNER_TEMP/download/kit.json"
            xcrun vtool -show-build "$app/$APP_NAME" | head -12
            du -sh "$app"
          done

      - name: Run the app in portrait in iPad and iPhone Simulators
        run: |
          app=$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/$APP_NAME.app
          IFS=';' read -ra devices <<< "$KIT_DEVICES"
          devices=("${devices[@]# }")
          /usr/bin/ruby lota/ipad/simulator.rb "$app" "$APP_IDENTIFIER" "$APP_NAME" "$RUNNER_TEMP/simulator" portrait "${devices[@]}"

      - name: Zip the Simulator app
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/simapp"
          cd "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator"
          ditto -c -k --keepParent "$APP_NAME.app" "$RUNNER_TEMP/simapp/$APP_NAME-simulator.app.zip"
          cd "$RUNNER_TEMP/simapp"
          shasum -a 256 ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-kit-simulator
          path: |
            ${{ runner.temp }}/simulator
            ${{ runner.temp }}/simapp
            ${{ runner.temp }}/logs
          retention-days: 30

  touch:
    name: Landscape, touch, and rotation (CI-only UI tests)
    needs: project
    if: ${{ !cancelled() && (needs.project.result == 'success' || inputs.project_run) }}
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LOTA_REPOSITORY }}
          ref: ${{ env.LOTA_REF }}
          persist-credentials: false
          sparse-checkout: ipad
          path: lota

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-kit
          path: ${{ runner.temp }}/download
          run-id: ${{ inputs.project_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Select the newest Xcode and install XcodeGen
        run: |
          xcode=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          brew install xcodegen

      # A copy of the kit's project with a UI test target, which the zip
      # never holds: its runner is a second app, with a second App ID.
      - name: Add the UI tests to a copy of the project
        run: |
          cd "$RUNNER_TEMP/download"
          shasum -a 256 -c SHA256SUMS
          app_name=$(/usr/bin/ruby -rjson -e 'print JSON.parse(File.read("kit.json"))["app_name"]')
          identifier=$(/usr/bin/ruby -rjson -e 'print JSON.parse(File.read("kit.json"))["identifier"]')
          { echo "APP_NAME=$app_name"; echo "APP_IDENTIFIER=$identifier"; } >> "$GITHUB_ENV"
          ditto -x -k "$app_name-ios.zip" "$RUNNER_TEMP/touch"
          project=$RUNNER_TEMP/touch/$app_name-ios
          mkdir -p "$project/UITests"
          cp "$GITHUB_WORKSPACE"/lota/ipad/uitests/*.m "$project/UITests/"
          /usr/bin/ruby -ryaml -e '
            path, name, id = ARGV
            spec = YAML.load_file(path)
            spec["targets"]["#{name}UITests"] = {
              "type" => "bundle.ui-testing", "platform" => "iOS", "sources" => [{ "path" => "UITests" }],
              "dependencies" => [{ "target" => name }],
              "settings" => { "base" => { "GENERATE_INFOPLIST_FILE" => true, "TEST_TARGET_NAME" => name,
                "PRODUCT_BUNDLE_IDENTIFIER" => "#{id}UITests", "CLANG_ENABLE_MODULES" => true, "OTHER_LDFLAGS" => "" } }
            }
            spec["targets"][name]["scheme"] = { "testTargets" => ["#{name}UITests"] }
            File.write(path, YAML.dump(spec))
          ' "$project/project.yml" "$app_name" "$identifier"
          xcodegen generate --spec "$project/project.yml" --project "$project"
          xcodebuild build-for-testing -project "$project/$app_name.xcodeproj" -scheme "$app_name" \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/touch-derived" CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/build-for-testing.log" 2>&1 || { tail -80 "$RUNNER_TEMP/build-for-testing.log"; exit 1; }
          ls "$RUNNER_TEMP"/touch-derived/Build/Products

      - name: Run the app in landscape, and tap and turn it
        run: |
          products=$RUNNER_TEMP/touch-derived/Build/Products
          app=$products/Debug-iphonesimulator/$APP_NAME.app
          IFS=';' read -ra devices <<< "$KIT_DEVICES"
          devices=("${devices[@]# }")
          KIT_EXTRA_LAUNCHES="" KIT_XCTESTRUN=$(find "$products" -maxdepth 1 -name "*.xctestrun" | head -1) \
            /usr/bin/ruby lota/ipad/simulator.rb "$app" "$APP_IDENTIFIER" "$APP_NAME" "$RUNNER_TEMP/landscape" landscape "${devices[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-kit-touch
          path: |
            ${{ runner.temp }}/landscape
            ${{ runner.temp }}/build-for-testing.log
          retention-days: 30
