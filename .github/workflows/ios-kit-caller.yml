# What a game's own CI holds to build its iOS kit: a call to Lota's
# ios-kit.yml as a reusable workflow, with lota_ref naming the ref its
# uses line names (doc/contributors/ios-kit.md). Here it builds Lota's
# own made-up game, test/games/moon_pong, as a game repository's
# workflow would build its own game from game_path ".".
name: iOS kit, called as a game's CI calls it

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ios-kit:
    uses: setdef/Lota/.github/workflows/ios-kit.yml@experiment/ios-kit-1
    with:
      lota_ref: experiment/ios-kit-1
      game_repository: ${{ github.repository }}
      game_ref: ${{ github.sha }}
      game_path: test/games/moon_pong
      display_name: "Moon Pong ’em"
      program: bin/moon_pong
      icon: test/games/moon_pong/icons
      kit_questions: test/games/moon_pong/kit-questions.txt
      smoke_env: MOON_PONG_QUIT_AFTER=12
      smoke_expect: "(?m)^moon pong: quitting after"
      extra_launches: MOON_PONG_QUIT_AFTER=3;MOON_PONG_QUIT_AFTER=4 MOON_PONG_EXTRA=1
