# SPDX-License-Identifier: AGPL-3.0-or-later

# The gate contributors run, bundle exec rake, on every push and pull
# request; then the precompiled gem it builds, installed on a fresh runner
# and run from there, once for each platform Lota ships a gem for: Apple
# Silicon macOS, Linux on x86_64 and arm64, and Windows on x64 and ARM64
# (ADR 011), whose jobs build the engine, check it, and run
# Lota's tests without the gate's Rake tasks (the Windows jobs say why).
# The macOS, Linux, and Windows jobs run side by side.
#
# Every push also runs, as jobs of the same run, the checks of the
# platforms Lota builds for without a gem, and of lota fuse: the phone
# route (phones.yml), the iOS kit as Lota's own CI calls it (ios-kit.yml),
# and, once each platform's gem is built, lota fuse on all five with those
# gems (fuse.yml). The iOS kit also runs as a game's CI calls it
# (ios-kit-caller.yml), but only in a run that can release here, and
# daily on its own (that workflow's schedule), since a second copy on
# every push took two thirds of a run's macOS minutes. So every platform
# Lota supports that GitHub's free runners can run is checked on
# trunk, and a red job there stops the line. Each trunk commit's own
# verdict comes first from the pre-push tier (prepush.yml), and this run
# follows as often as macOS runners allow (concurrency, below).
#
# macOS: LÖVE's own CI runs its tests on macOS runners with the normal
# video driver (vendor/love/.github/workflows/main.yml, the macOS job),
# since SDL's offscreen driver cannot create a Metal or OpenGL context on
# macOS; Lota's tests open real windows too. Every macOS job runs on
# macos-15: Apple Silicon, macOS 15 (actions/runner-images README,
# "Available Images"), the oldest macOS Lota supports
# (doc/contributors/design/packaging.md), named rather than macos-latest, which
# moves to each new macOS. The image logs its user in to a GUI session at boot
# (images/macos/scripts/build/configure-autologin.sh, which
# templates/macOS-15.arm64.anka.pkr.hcl runs), so windows open as on a
# contributor's Mac.
#
# Linux: LÖVE's own Linux CI (the same workflow's Linux job) installs its
# build packages with apt, builds every dependency from source with
# love2d/love-appimage-source's Makefile, and runs Lövetest under Xvfb
# with Openbox, on OpenGL through Mesa's software renderer; Lota's Linux
# jobs do the same (tasks/linux_build.rb), on Ubuntu 22.04 for both x86_64
# and arm64, so both gems need the same glibc, 2.35. LÖVE's arm64 job runs
# on ubuntu-24.04-arm, whose glibc, 2.39, would leave out every system
# older than Ubuntu 24.04 for the arm64 gem alone.
#
# Release: the release job publishes a GitHub release of the gems the
# delivery jobs installed and ran, but only when every platform's gate (on
# Windows, its build) and delivery passed, and the phone, iOS kit, and
# fuse checks with them. A release is a promise about each platform it
# lists, and one missing a platform would leave the games that depend on
# it there with nothing to install (doc/contributors/releasing.md). A
# release picks the commit this run proved, wherever trunk has moved
# since, and writes nothing to trunk first: the version job decides,
# before any gem is built, what the commit releases as, every job that
# builds a gem stamps that version into it, and the release job tags the
# commit and publishes those gems. It releases a full run's commit on
# trunk, and a tag such as v0.1.0 on a commit of trunk when CI is run by
# hand on the tag. Run by
# hand on a branch, the release job is a dry run: it assembles the
# release the commit would make, says what it would do, and keeps it as
# an artifact.

name: CI

on:
  # Pushes to branches only: a tag starts nothing, whichever token
  # pushes it, so the tag a release makes costs no second full run. Run
  # CI by hand on a tag to release it (doc/contributors/releasing.md).
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      ignore_gate_failures:
        description: >-
          Test only: build, deliver, and assemble the gems even where a
          gate fails, to try the release job. Refused where it would
          publish.
        type: boolean
        default: false

permissions:
  contents: read

# What proves each commit: every trunk commit gets a run of the pre-push
# tier of its own (prepush.yml: rake prepush on macOS and x86_64 Linux,
# the Windows checks on x64, and red_before_green), never cancelled.
# This full run coalesces: one that has started on trunk is never
# cancelled, but while it runs only the newest push to trunk waits, as
# GitHub cancels a waiting run when a newer one joins the group. So a
# trunk commit is proven by a full run of its own or by the first full
# run on a later commit, which holds it. A tag is a ref of its own, so
# a run started by hand on it is in a group of its own and runs in full,
# and the release job reads nothing but that run. A branch run gives way to a
# newer push. A full run asks for about eight macOS jobs, some 175
# runner-minutes, and the free plan runs five macOS jobs at once, so a
# full run for every commit queued hours deep, with the tier's macOS
# job behind it. Coalescing costs a release nothing: the release job
# releases whichever commit the run that finishes proved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

defaults:
  run:
    shell: bash

env:
  # Ruby comes from ruby/setup-ruby, not mise, so mise ignores the Ruby in
  # mise.toml, and the Rust it pins only for compiling that Ruby.
  # mise.toml has mise compile Ruby with ruby-build, since jdx/ruby's
  # precompiled macOS build passes --enable-yjit and installs Rust 1.58
  # (libexec/package.rb), too old for Ruby's ZJIT check (configure.ac's
  # "prerequisites for ZJIT", which needs Rust 1.85 or newer, for the 2024
  # edition), so it has no ZJIT, and ruby --zjit only warns and runs the
  # interpreter. setup-ruby's Ruby is built by ruby-build with the
  # runner's Rust (ruby/ruby-builder, .github/workflows/build.yml), as a
  # Ruby mise compiles is, and has both JITs, which rake bench measures,
  # without compiling Ruby on every run.
  MISE_DISABLE_TOOLS: ruby,rust
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"
  # Every parity test runs the reference love here, and keeps nothing
  # (test/parity/reference_cache.rb). A cache carried from one run to the
  # next by actions/cache would hit only when the reference love built
  # anew is the same file byte for byte, on a runner image the same down
  # to its packages, its displays, and its environment, which the key
  # names; a miss would still cost uploading and downloading every frame.
  # The gate runs once a job, so a cache kept for the job would only be
  # written, never read.
  LOTA_PARITY_CACHE: "0"

jobs:
  # What this commit releases as, decided before any gem is built, so the
  # gems the run builds carry it, and the gems a release publishes are the
  # ones this run verified (doc/contributors/releasing.md). rake
  # release:version reads it from git at this commit, wherever trunk has
  # moved: the last release tag before it, and what its CHANGELOG.md's
  # [Unreleased] adds since; the next PATCH, or the next MINOR for a
  # Breaking: entry; nothing when it adds nothing, when a release tag
  # already holds it, or from 1.0.0 on. It refuses, naming each, when sig/
  # removes or changes the API with no Breaking: entry. For a tag, it
  # checks the tag instead, and its refusal fails the run. Elsewhere a
  # refusal stops the release, not the run: the gems carry 0.0.1.dev, and
  # the refuse-release job shows why.
  version:
    name: Decide the version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.decide.outputs.version }}
      refusal: ${{ steps.decide.outputs.refusal }}
    steps:
      # Every commit and tag, which the decision reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install libyaml
        run: |
          sudo apt-get update
          bin/apt-packages list bundle | xargs sudo apt-get install --assume-yes

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/lota/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -rdigest -e 'print RUBY_VERSION, "-", RUBY_PLATFORM, "-", Digest::SHA256.hexdigest(RbConfig::CONFIG["configure_args"])[0, 16]')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/bundle
          key: gems-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      - name: Decide what this commit releases as
        id: decide
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if version=$(bundle exec rake --silent "release:version[$GITHUB_SHA,$TAG]" 2> "$RUNNER_TEMP/reason"); then
            cat "$RUNNER_TEMP/reason"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            if [ -n "$version" ]; then
              echo "::notice::$GITHUB_SHA releases as $version: $(cat "$RUNNER_TEMP/reason")"
            fi
          else
            cat "$RUNNER_TEMP/reason"
            if [ -n "$TAG" ]; then
              echo "::error::$TAG releases nothing: $(head -n 1 "$RUNNER_TEMP/reason")"
              exit 1
            fi
            {
              echo "refusal<<REFUSAL"
              cat "$RUNNER_TEMP/reason"
              echo "REFUSAL"
            } >> "$GITHUB_OUTPUT"
          fi

  # A refusal from the version job, such as an API break with no Breaking:
  # entry, shown as this job's failure. It stops the release, not trunk:
  # the commit the run proves is no worse for it, so the run stays green
  # (continue-on-error).
  refuse-release:
    name: Refuse the release
    needs: version
    if: needs.version.outputs.refusal != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Say why this commit releases nothing
        env:
          REFUSAL: ${{ needs.version.outputs.refusal }}
        run: |
          echo "$REFUSAL"
          echo "::error::This commit releases nothing: $(echo "$REFUSAL" | head -n 1)"
          exit 1

  gate:
    name: Gate
    needs: version
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      # The engine builds from vendor/love and links the frameworks in
      # vendor/love-apple-dependencies.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # The tests open real windows, which needs an Aqua session.
      - name: Report the GUI session
        run: echo "launchctl managername is $(launchctl managername)"

      # The Ruby version mise.toml pins, which setup-ruby reads from it.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      # mise.toml pins the other tools contributors use (bin/setup), the
      # REUSE tool among them; CI installs the same pins the same way. Its
      # cache is keyed by mise.toml's hash.
      - uses: ./.github/actions/mise

      # Bundler and ccache keep their files outside the checkout, where
      # RuboCop and the REUSE tool would read them.
      - name: Place Bundler and ccache outside the checkout
        id: paths
        run: |
          {
            echo "BUNDLE_PATH=$HOME/.cache/lota/bundle"
            echo "CCACHE_DIR=$HOME/.cache/lota/ccache"
          } >> "$GITHUB_ENV"
          echo "ruby=$(ruby -rdigest -e 'print RUBY_VERSION, "-", RUBY_PLATFORM, "-", Digest::SHA256.hexdigest(RbConfig::CONFIG["configure_args"])[0, 16]')" >> "$GITHUB_OUTPUT"
          echo "submodules=$(git submodule status | shasum -a 256 | cut -c 1-16)" >> "$GITHUB_OUTPUT"

      # Gems with native extensions compile against one Ruby on one macOS,
      # so the key names both, with the lockfile. Ruby's version and
      # platform do not tell one build of it from another, so the key also
      # hashes the arguments Ruby was configured with. Only an exact match
      # restores.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/bundle
          key: gems-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      # The source archives the precompiled gem carries beside the
      # frameworks whose licenses ask for them (ext/lota/licenses.rb),
      # downloaded once and checked by their SHA-256, so the gate itself
      # needs no network.
      - name: Fetch the source archives
        run: bundle exec rake sources:fetch

      # ccache reuses an object only when the compiler, its arguments, the
      # source, and every header it includes hash the same, so any earlier
      # cache is safe to start from; a cache of the build tree would not be,
      # and would rebuild everything anyway, since the checkout gives every
      # source a new mtime. Apple's compilers sit behind xcrun shims, so
      # the compiler is identified by its version output, not its file.
      - name: Compile through ccache
        run: |
          {
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_COMPILERCHECK=%compiler% -v"
            echo "CCACHE_MAXSIZE=2G"
            for language in C CXX OBJC OBJCXX; do echo "CMAKE_${language}_COMPILER_LAUNCHER=ccache"; done
          } >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-
      - name: Zero ccache's statistics
        run: ccache --zero-stats

      # Minitest prints each test's name and time (A is Minitest::TestTask's
      # argument variable), so a stuck test shows which it is. The gate's
      # test:parity builds the reference love from vendor/love with LÖVE's
      # own macOS CI commands, through the ccache configured above, and
      # runs each fixture game in it and in Lota (tasks/reference_love.rb,
      # test/parity). The runner's default Xcode builds it.
      #
      # A dry run may go on past a failing gate, but never on a tag (the
      # ignore_gate_failures input).
      #
      # The gate ends a lane that runs past its budget after printing what
      # the lane was doing, and this step's 70 minutes leave it room to
      # (Gate::LANE_TIMEOUT in tasks/gate.rb keeps the arithmetic), so a
      # check that hangs fails with its processes' stacks printed instead
      # of being stopped here with nothing printed. The steps before this
      # one have taken under two minutes, and those after a failed gate
      # under one, within the job's 75.
      - name: Run the gate
        timeout-minutes: 70
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_gate_failures && github.ref_type == 'branch' }}
        env:
          A: --verbose
        run: bundle exec rake

      # The gate starts with lint:fix, which corrects RuboCop offenses and
      # adds missing license headers, so an offense would pass as a fix
      # nobody committed. A changed or new file fails here instead.
      - name: Fail if the gate changed a file
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff
            echo "::error::bundle exec rake changed files; run it locally and commit what it changes"
            exit 1
          fi

      # The first frame that differed in each parity run that failed, as
      # LÖVE and Lota showed it (test/parity/probe.rb).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: parity-mismatches-arm64-darwin
          path: tmp/parity-mismatches
          if-no-files-found: ignore
          retention-days: 14

      # xcodebuild's log of the reference love, for a build that failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reference-love-build-log
          path: tmp/reference/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report ccache's statistics
        if: always()
        run: ccache --show-stats

      # Only the default branch saves, so branches start from its cache
      # without crowding it out.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.ref_name == github.event.repository.default_branch
        with:
          path: ~/.cache/lota/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-${{ github.run_id }}

      # The version this run releases as, if any, after the check above,
      # which the stamp's edits would fail.
      - uses: ./.github/actions/version
        with:
          version: ${{ needs.version.outputs.version }}

      # The gem's SHA-256 travels with it, so the delivery job installs
      # the gem this job built, and a release publishes the gem the
      # delivery job installed, byte for byte. Where the gate runs
      # package:install, it leaves a gem of 0.0.1.dev in pkg/, built before
      # the version was stamped, so pkg/ is emptied of this platform's gems
      # first, and the artifact holds the stamped gem alone.
      - name: Build the precompiled gem
        run: |
          rm -f pkg/lota-*-arm64-darwin.gem pkg/lota-*-arm64-darwin.gem.sha256
          bundle exec rake package:native
          cd pkg
          for gem in lota-*-arm64-darwin.gem; do shasum -a 256 "$gem" > "$gem.sha256"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lota-arm64-darwin
          path: pkg/lota-*-arm64-darwin.gem*
          if-no-files-found: error
          retention-days: 14

  # The gem the gate built, on a runner that never built it: no engine
  # build, no compiled bundle in lib/. The checkout holds the tasks that
  # check the gem and the games they run; Lota comes only from the gem.
  # rake package:deliver installs the gem with gem install --local into an
  # empty GEM_HOME, and runs every child process with no Bundler, no
  # RUBYLIB, and no other gem. lota run then runs two games: one that opens
  # a window, clears it, and quits with status 3, and test/lovetest/game,
  # Lövetest's love.test.graphics.clear translated, compared with LÖVE's
  # expected image by Lövetest's rule. A guard
  # loaded into each run fails it if anything loads from the checkout's
  # lib/, and dyld's report must show Lota's bundle and SDL3 loading from
  # the installed gem (tasks/package_check.rb). bundle exec rake
  # package:install runs the same check locally, on a gem it builds first.
  #
  # The expected image is in vendor/love/testing/output/expected, so only
  # that submodule is fetched, at depth 1: it holds no Ruby, and
  # vendor/love-apple-dependencies, whose frameworks the gem carries, stays
  # out, so SDL3 can only load from the gem.
  delivery:
    name: Delivery
    needs: gate
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch LÖVE's expected images
        run: git submodule update --init --depth 1 vendor/love

      - name: Report the GUI session
        run: echo "launchctl managername is $(launchctl managername)"

      # The same Ruby the gate built the gem with.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/lota/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -rdigest -e 'print RUBY_VERSION, "-", RUBY_PLATFORM, "-", Digest::SHA256.hexdigest(RbConfig::CONFIG["configure_args"])[0, 16]')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/bundle
          key: gems-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lota-arm64-darwin
          path: ${{ runner.temp }}/gem

      - name: Check the gem is the one the gate built
        working-directory: ${{ runner.temp }}/gem
        run: shasum -a 256 --check ./*.sha256

      - name: Install the gem and run Lövetest from it
        run: |
          gems=$(IFS=,; files=("$RUNNER_TEMP"/gem/*.gem); echo "${files[*]}")
          bundle exec rake "package:deliver[$gems]"

      # What a release publishes for this platform (the release job): the
      # gem just installed and run, unchanged by it.
      - name: Check the gem is still the one the gate built
        working-directory: ${{ runner.temp }}/gem
        run: shasum -a 256 --check ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-lota-arm64-darwin
          path: ${{ runner.temp }}/gem/lota-*
          if-no-files-found: error
          retention-days: 14

  # The gate on Linux, on x86_64 and on arm64. LÖVE's Linux CI installs
  # these packages to build SDL, OpenAL Soft, and LÖVE (main.yml's Linux
  # job, "Install Dependencies"), and runs Lövetest on a virtual display;
  # the gate builds the same libraries the same way (tasks/linux_build.rb)
  # and opens its windows there. The libraries and what they build from are
  # cached by the Makefile and recipe that build them, so a run rebuilds
  # them only when either changes.
  linux-gate:
    name: Gate (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: x86_64-linux-gnu
          - runner: ubuntu-22.04-arm
            platform: aarch64-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # The display Xvfb serves, as LÖVE's Linux job names it.
      DISPLAY: ":99"
      # The parity harness's own display, where no window of the gate's
      # other checks, which run at the same time, opens over its runs and
      # takes the pointer moves its scripts make (Parity.display); in the
      # gate, each parity shard's lane gives the harness its own display.
      LOTA_PARITY_DISPLAY: ":98"
      # A display for each of the gate's lanes but the last two, whose
      # checks open no window, in the order of tasks/gate.rake's lanes, so
      # that no lane's windows open over another's and take the pointer
      # moves its tests make (tasks/gate.rb); each parity shard's lane has
      # its own.
      LOTA_GATE_DISPLAYS: ":99 :97 :96 :98"
    steps:
      # The engine builds from vendor/love, and its dependencies with
      # vendor/love-appimage-source's Makefile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # main.yml's Linux job, "Install Dependencies", word for word but for
      # its Vulkan driver, which only its Vulkan tests use, with Xvfb, which
      # it finds on the runner already, libyaml's development files, which
      # Bundler compiles psych against, and GCC 12's libstdc++ headers for
      # clang-tidy (rake cpp:tidy), which reads the newest it finds: its
      # analyzer follows GCC 12's std::shared_ptr, and reports a leak in
      # every Rice::Object it reads through GCC 11's, the compiler's own.
      - name: Install LÖVE's Linux build dependencies
        run: |
          sudo apt-get update
          bin/apt-packages list build runner | xargs sudo apt-get install --assume-yes

      # main.yml's "Start xvfb and openbox", with a screen that holds the
      # tests' windows: LÖVE's 360x240 is smaller than the 800x600 window
      # a game opens by default. Every lane's display, the parity
      # harness's and DISPLAY among them, is the same.
      - name: Start Xvfb and Openbox
        run: |
          read -r -a displays <<< "$LOTA_GATE_DISPLAYS"
          for display in "${displays[@]}"; do
            Xvfb "$display" -screen 0 1280x1024x24 &
          done
          sleep 3
          for display in "${displays[@]}"; do
            DISPLAY="$display" openbox &
          done

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - uses: ./.github/actions/mise

      - name: Place Bundler and ccache outside the checkout
        id: paths
        run: |
          {
            echo "BUNDLE_PATH=$HOME/.cache/lota/bundle"
            echo "CCACHE_DIR=$HOME/.cache/lota/ccache"
          } >> "$GITHUB_ENV"
          echo "ruby=$(ruby -rdigest -e 'print RUBY_VERSION, "-", RUBY_PLATFORM, "-", Digest::SHA256.hexdigest(RbConfig::CONFIG["configure_args"])[0, 16]')" >> "$GITHUB_OUTPUT"
          echo "submodules=$(git submodule status | sha256sum | cut -c 1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/bundle
          key: gems-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      # What love-appimage-source's Makefile downloads, which rake
      # sources:fetch keeps in vendor/sources/linux, and the libraries rake
      # dependencies builds from it in tmp/dependencies, each keyed by what
      # makes it: the Makefile, and for the libraries the recipe too. The
      # recipe checks the compiler itself, and builds again if the runner's
      # has changed. The downloads are keyed by the runner's processor too,
      # because the Makefile downloads the CMake for the machine it runs on.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/sources/linux
          key: linux-sources-${{ runner.arch }}-${{ hashFiles('vendor/love-appimage-source/Makefile') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/dependencies
          key: linux-dependencies-${{ matrix.runner }}-${{ hashFiles('vendor/love-appimage-source/Makefile', 'tasks/linux_build.rb') }}

      # The source archives the precompiled gem carries, and on Linux what
      # LÖVE's dependencies build from, so the gate itself needs no network.
      - name: Fetch the sources
        run: bundle exec rake sources:fetch

      # As on macOS; GCC is not behind a shim, so ccache's default check of
      # the compiler's file serves.
      - name: Compile through ccache
        run: |
          {
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=2G"
            for language in C CXX; do echo "CMAKE_${language}_COMPILER_LAUNCHER=ccache"; done
          } >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-
      - name: Zero ccache's statistics
        run: ccache --zero-stats

      # The gate's test:parity builds the reference love from vendor/love
      # with love-appimage-source's Makefile, as LÖVE's own Linux CI does,
      # beside the dependencies.
      - name: Run the gate
        timeout-minutes: 100
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_gate_failures && github.ref_type == 'branch' }}
        env:
          A: --verbose
        run: bundle exec rake

      - name: Fail if the gate changed a file
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff
            echo "::error::bundle exec rake changed files; run it locally and commit what it changes"
            exit 1
          fi

      # The first frame that differed in each parity run that failed, as
      # LÖVE and Lota showed it (test/parity/probe.rb).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: parity-mismatches-${{ matrix.platform }}
          path: tmp/parity-mismatches
          if-no-files-found: ignore
          retention-days: 14

      # The log of the dependencies' and the reference love's build, for a
      # build that failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-build-log-${{ matrix.platform }}
          path: tmp/dependencies/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report ccache's statistics
        if: always()
        run: ccache --show-stats

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.ref_name == github.event.repository.default_branch
        with:
          path: ~/.cache/lota/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-${{ github.run_id }}

      - uses: ./.github/actions/version
        with:
          version: ${{ needs.version.outputs.version }}

      # As on macOS: the stamped gem alone, not the gate's own of 0.0.1.dev.
      - name: Build the precompiled gem
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          rm -f pkg/lota-*-"$PLATFORM".gem pkg/lota-*-"$PLATFORM".gem.sha256
          bundle exec rake package:native
          cd pkg
          for gem in lota-*-"$PLATFORM".gem; do sha256sum "$gem" > "$gem.sha256"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lota-${{ matrix.platform }}
          path: pkg/lota-*-${{ matrix.platform }}.gem*
          if-no-files-found: error
          retention-days: 14

  # The Linux gem the gate built, on a runner that never built it, as the
  # macOS delivery job does: none of the packages LÖVE's build installs,
  # only what a player's desktop has, a display and Mesa's OpenGL, and
  # nothing of LÖVE's but its expected images. The gem carries every
  # library LÖVE's Linux build makes, and relies on the system for glibc,
  # the C++ runtime, X11, and OpenGL, which SDL loads when it starts.
  linux-delivery:
    name: Delivery (${{ matrix.platform }})
    needs: linux-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: x86_64-linux-gnu
          - runner: ubuntu-22.04-arm
            platform: aarch64-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch LÖVE's expected images
        run: git submodule update --init --depth 1 vendor/love

      # A desktop's display server and OpenGL, not their development files,
      # and libyaml's, which Bundler compiles psych against for the bundle
      # that runs the check.
      - name: Install a display and OpenGL
        run: |
          sudo apt-get update
          bin/apt-packages list display | xargs sudo apt-get install --assume-yes

      - name: Start Xvfb and Openbox
        run: |
          Xvfb "$DISPLAY" -screen 0 1280x1024x24 &
          sleep 3
          openbox &

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/lota/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -rdigest -e 'print RUBY_VERSION, "-", RUBY_PLATFORM, "-", Digest::SHA256.hexdigest(RbConfig::CONFIG["configure_args"])[0, 16]')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/bundle
          key: gems-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lota-${{ matrix.platform }}
          path: ${{ runner.temp }}/gem

      - name: Check the gem is the one the gate built
        working-directory: ${{ runner.temp }}/gem
        run: sha256sum --check ./*.sha256

      - name: Install the gem and run Lövetest from it
        run: |
          gems=$(IFS=,; files=("$RUNNER_TEMP"/gem/*.gem); echo "${files[*]}")
          bundle exec rake "package:deliver[$gems]"

      - name: Check the gem is still the one the gate built
        working-directory: ${{ runner.temp }}/gem
        run: sha256sum --check ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-lota-${{ matrix.platform }}
          path: ${{ runner.temp }}/gem/lota-*
          if-no-files-found: error
          retention-days: 14

  # Lota on Windows, built and tested by windows.yml, which says how, once
  # for each platform.
  windows-build:
    name: Windows build (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: x64-mingw-ucrt
            msystem: UCRT64
            compiler: gcc:p
            mesa: ""
            foreground_held: ""
            cc: gcc
            cxx: g++
            ccache: D:/ccache
          # RubyInstaller's ARM64 Ruby is built with MSYS2's CLANGARM64
          # environment, which has no GCC.
          - runner: windows-11-arm
            platform: aarch64-mingw-ucrt
            msystem: CLANGARM64
            compiler: clang:p lld:p llvm-tools:p
            mesa: mesa:p
            # A window of the shell's holds this runner's foreground
            # (test/lovetest/held_foreground.rb).
            foreground_held: "1"
            cc: clang
            cxx: clang++
            ccache: C:/ccache
    uses: ./.github/workflows/windows.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      msystem: ${{ matrix.msystem }}
      compiler: ${{ matrix.compiler }}
      mesa: ${{ matrix.mesa }}
      foreground_held: ${{ matrix.foreground_held }}
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      ccache: ${{ matrix.ccache }}
      version: ${{ needs.version.outputs.version }}
      ignore_failures: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_gate_failures && github.ref_type == 'branch' }}

  # The Windows gem the build job built, on a runner that never built it,
  # as the macOS and Linux delivery jobs do: RubyInstaller's Ruby and the
  # repository's tasks, without the dependencies or the engine, with only
  # the MSYS2 setup-ruby installs, from which RubyInstaller's head build
  # loads its own extensions' DLLs, and with a PATH of only Ruby, Windows,
  # Windows PowerShell, which the guard asks for the modules a run
  # loaded, and Git, with which the check lists the repository's files.
  # It installs the gem into an empty
  # GEM_HOME and runs lota from it (tasks/package_check.rb): lota
  # --version, every Ruby file loaded from the installed gem, and a game
  # that opens no window and plays a sound through the gem's OpenAL32.dll
  # (WINDOWLESS_GAME in tasks/package.rake), with Lota, the bundle, the
  # preloader, and OpenAL32.dll loaded from the installed gem.
  windows-delivery:
    name: Delivery (${{ matrix.platform }})
    needs: windows-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: x64-mingw-ucrt
          - runner: windows-11-arm
            platform: aarch64-mingw-ucrt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-ruby's MSYS2 toolchain, whose MINGW bin folder holds the
      # zlib1.dll RubyInstaller's head build does not carry, and then the
      # Ruby windows_ruby.env pins, first on the PATH (ADR 013).
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: head
          windows-toolchain: default
          bundler: none
      - uses: ./.github/actions/windows-ruby
        with:
          dll_path: ${{ env.RI_DEVKIT }}\${{ runner.arch == 'ARM64' && 'clangarm64' || 'ucrt64' }}\bin

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lota-${{ matrix.platform }}
          path: ${{ runner.temp }}/gem

      - name: Check the gem is the one the build job built
        working-directory: ${{ runner.temp }}/gem
        run: sha256sum --check ./*.sha256

      - name: Install the gem and run a game from it
        run: |
          clean="$(dirname "$(which ruby)"):/c/Windows/system32:/c/Windows:/c/Windows/System32/WindowsPowerShell/v1.0:/c/Program Files/Git/cmd"
          gems=("$RUNNER_TEMP"/gem/*.gem)
          PATH="$clean" ruby .github/windows_checks.rb deliver "${gems[@]}"

      - name: Check the gem is still the one the build job built
        working-directory: ${{ runner.temp }}/gem
        run: sha256sum --check ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-lota-${{ matrix.platform }}
          path: ${{ runner.temp }}/gem/lota-*
          if-no-files-found: error
          retention-days: 14

  # The phone route (phones.yml): iOS and iPadOS in the Simulator, and
  # Android built and run on emulators. Its jobs are this run's own.
  phones:
    name: Phones
    uses: ./.github/workflows/phones.yml

  # The iOS kit (ios-kit.yml), built from this commit for test/games/winkit,
  # which prints what Lota sees and quits with 0 after its WINKIT_SECONDS,
  # and whose touch launch runs its DPI probe (test/games/winkit/main.rb).
  ios-kit:
    name: iOS kit
    uses: ./.github/workflows/ios-kit.yml
    permissions:
      contents: read
      actions: read
    with:
      lota_ref: ${{ github.sha }}
      game_repository: ${{ github.repository }}
      game_ref: ${{ github.sha }}
      game_path: test/games/winkit
      display_name: Winkit
      smoke_env: WINKIT_HIGHDPI=1
      smoke_expect: "(?m)^exiting with 0$"
      touch_env: WINKIT_DPI_PROBE=1 WINKIT_SECONDS=150
      # The sample game's call in this run takes the default name, ios-kit.
      artifact_name: ios-kit-winkit

  # The iOS kit again, called as a game's own CI calls it
  # (ios-kit-caller.yml), for test/games/sample_game. It runs by hand, on
  # a tag among others, and on a push to trunk whose commit releases as a
  # version, which are the runs the release job publishes or rehearses,
  # and not on any other push, where the kit has just run for
  # test/games/winkit; that workflow's own schedule runs it daily. The release job needs it, so
  # the kit runs before every release.
  ios-kit-call:
    name: iOS kit, called as a game's CI calls it
    needs: version
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && needs.version.outputs.version != ''
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: ./.github/workflows/ios-kit-caller.yml
    permissions:
      contents: read
      actions: read

  # lota fuse on each of the five platforms (fuse.yml), with the gems this
  # run's gate and build jobs built, so it fuses with this commit's gems,
  # never a release's.
  fuse:
    name: Fuse
    needs: [version, gate, linux-gate, windows-build]
    uses: ./.github/workflows/fuse.yml
    permissions:
      contents: read
      actions: read
    with:
      this_run: true
      version: ${{ needs.version.outputs.version }}

  # The release (doc/contributors/releasing.md), from the gems the
  # delivery jobs installed and ran, never rebuilt, which carry the
  # version the version job decided. It runs when that job named a
  # version: on a push to trunk, where it releases this run's commit
  # however far trunk has moved on since; and by hand, which on a tag
  # releases that tag and on any other branch is a dry run. Never for a pull
  # request, and never in a fork. It needs every platform's gate and
  # delivery, and the phone, iOS kit, and fuse checks, to have passed, so
  # a commit where any of them failed is neither tagged nor published;
  # rerun the failed jobs, or fix trunk and let the next green run
  # release. Its token alone may write, and only the repository's
  # contents, which a tag and a GitHub release are, and the RELEASE_TOKEN
  # secret may stand in for it; it pushes nothing to a branch. No tag
  # starts a run, so nothing publishes twice, and a rerun finds the tag
  # or the release there already and leaves it (rake release:plan). A new
  # platform joins with a job that builds its gem and a delivery job that
  # uploads it verified, as verified-lota-<platform>, both in needs, and
  # the platform in PLATFORMS.
  release:
    name: Release
    needs: [version, gate, delivery, linux-gate, linux-delivery, windows-build, windows-delivery, phones, ios-kit, ios-kit-call,
      fuse]
    if: >-
      github.repository == 'setdef/Lota' && needs.version.outputs.version != ''
      && ((github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # One release at a time.
    concurrency:
      group: >-
        ${{ (github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        && format('{0}-publish', github.workflow) || format('{0}-dry-run-{1}', github.workflow, github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # One gem for each, every one of which the release must carry.
      PLATFORMS: arm64-darwin x86_64-linux-gnu aarch64-linux-gnu x64-mingw-ucrt aarch64-mingw-ucrt
      VERSION: ${{ needs.version.outputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Publish for a tag and on trunk; anywhere else, rehearse. A run that
      # went on past failing gates never publishes.
      - name: Decide whether this run publishes
        id: mode
        env:
          IGNORE_GATE_FAILURES: ${{ inputs.ignore_gate_failures }}
        run: |
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            publish=true
          elif [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            publish=true
          fi
          if [ "$IGNORE_GATE_FAILURES" = true ]; then
            if [ "$publish" = true ]; then
              echo "::error::ignore_gate_failures is for a dry run, never a release"
              exit 1
            fi
            echo "::warning::A dry run that ignored the gates' failures; a release publishes nothing from this commit unless they pass"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # Every branch and tag, to ask whether the commit is on trunk and
      # which releases hold it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A tag anyone with push access can put on any commit, so the
      # commit must already be on trunk, where the gate ran on it.
      - name: Check the commit is on the default branch
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "$GITHUB_SHA is on $DEFAULT_BRANCH"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on $DEFAULT_BRANCH; releases are cut from $DEFAULT_BRANCH"
            exit 1
          else
            echo "::warning::$GITHUB_SHA is not on $DEFAULT_BRANCH, so it would release nothing"
          fi

      - name: Install libyaml
        run: |
          sudo apt-get update
          bin/apt-packages list bundle | xargs sudo apt-get install --assume-yes

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/lota/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -rdigest -e 'print RUBY_VERSION, "-", RUBY_PLATFORM, "-", Digest::SHA256.hexdigest(RbConfig::CONFIG["configure_args"])[0, 16]')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/bundle
          key: gems-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      # What the release still needs, asked again now that every job has
      # passed: a tag and a release, a release, or nothing, when a rerun
      # finds both, or when a release made since the run began holds this
      # commit or moved the version on, so the gems carry the wrong one. A
      # tag on another commit is refused, as a tag never moves. The notes
      # are what this commit's [Unreleased] adds since the release before
      # it.
      #
      # The token that reads, tags, and publishes, named here once and
      # given only to the steps that call GitHub: the RELEASE_TOKEN secret
      # when the repository has one, and this job's own token otherwise,
      # so a token with the right to tag drops in with no other change.
      - name: Decide what the release needs
        id: plan
        env: &release-token
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          released=false
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            released=true
          fi
          if ! action=$(bundle exec rake --silent "release:plan[$GITHUB_SHA,$VERSION,$released]" 2> "$RUNNER_TEMP/reason"); then
            cat "$RUNNER_TEMP/reason"
            exit 1
          fi
          echo "v$VERSION on $GITHUB_SHA: $action, as $(cat "$RUNNER_TEMP/reason")"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          if [ "$action" = skip ]; then
            echo "::notice::$GITHUB_SHA releases nothing: $(cat "$RUNNER_TEMP/reason")"
          else
            bundle exec rake "release:notes[$GITHUB_SHA,$RUNNER_TEMP/notes.md]"
            cat "$RUNNER_TEMP/notes.md"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.plan.outputs.action == 'tag_and_publish' || steps.plan.outputs.action == 'publish'
        with:
          pattern: verified-lota-*
          merge-multiple: true
          path: ${{ runner.temp }}/release

      # Exactly one gem of the version for each platform, each the one its
      # delivery job verified, and SHA256SUMS for them all.
      - name: Assemble the release
        if: steps.plan.outputs.action == 'tag_and_publish' || steps.plan.outputs.action == 'publish'
        run: |
          read -r -a platforms <<< "$PLATFORMS"
          bundle exec rake "release:assemble[$RUNNER_TEMP/release,$VERSION$(printf ',%s' "${platforms[@]}")]"
          cat "$RUNNER_TEMP/release/SHA256SUMS"

      # An annotated tag, made through the API in two calls, the tag object
      # and then its ref, which refuses a tag that exists rather than move
      # it. A refusal names the call GitHub refused, with all gh printed.
      - name: Tag the commit
        if: steps.mode.outputs.publish == 'true' && steps.plan.outputs.action == 'tag_and_publish'
        env: *release-token
        run: |
          if ! object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="v$VERSION" -f message="Lota $VERSION" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha 2> "$RUNNER_TEMP/tag-error"); then
            echo "::error::POST repos/$GITHUB_REPOSITORY/git/tags, the tag object v$VERSION for $GITHUB_SHA, was refused: $(cat "$RUNNER_TEMP/tag-error")"
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$object" > /dev/null 2> "$RUNNER_TEMP/tag-error"; then
            echo "::error::POST repos/$GITHUB_REPOSITORY/git/refs, the ref refs/tags/v$VERSION for tag object $object, was refused: $(cat "$RUNNER_TEMP/tag-error")"
            exit 1
          fi
          echo "Tagged $GITHUB_SHA v$VERSION"

      - name: Publish the release
        if: steps.mode.outputs.publish == 'true' && (steps.plan.outputs.action == 'tag_and_publish' || steps.plan.outputs.action == 'publish')
        env: *release-token
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Lota $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/release/*

      # Which commit the release picked, and where the branch is now: a
      # release never waits for the branch to stand still.
      - name: Say what the release did, or would have done
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          tip=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          where=""
          if [ -n "$tip" ]; then
            where="; the tip of $GITHUB_REF_NAME is now $tip"
          fi
          if [ "$PUBLISH" = true ]; then
            echo "::notice::$ACTION v$VERSION on $GITHUB_SHA$where"
          else
            echo "::notice::A dry run on $GITHUB_REF_NAME; publishing, this run would $ACTION v$VERSION on $GITHUB_SHA$where"
          fi

      - name: Copy the notes beside the gems
        if: >-
          steps.mode.outputs.publish != 'true'
          && (steps.plan.outputs.action == 'tag_and_publish' || steps.plan.outputs.action == 'publish')
        run: cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          steps.mode.outputs.publish != 'true'
          && (steps.plan.outputs.action == 'tag_and_publish' || steps.plan.outputs.action == 'publish')
        with:
          name: release-dry-run-v${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14

  # The bookkeeping a release leaves for afterward
  # (doc/contributors/releasing.md): on top of trunk as it is now, a dated
  # section in CHANGELOG.md for each release tag it has none for, moving
  # exactly the entries that release's commit added out of [Unreleased],
  # and leaving entries added since (rake changelog:record, Release#record).
  # It reads only the tags, so it runs after every full run on trunk, not
  # only one that released, and puts back any section a failed push left
  # out. It pushes an ordinary commit without force, rebasing and trying
  # again when trunk moves first. A push GitHub's token makes starts no
  # workflow, so the commit starts no release of its own, and the next
  # push's runs prove it; it adds no entry, so no release is made for it
  # alone. Its failures leave the changelog behind, not trunk red, so the
  # run stays green (continue-on-error), and the next run tries again. Its
  # token may write the repository's contents, to push the commit, and
  # nothing else.
  changelog:
    name: Record the releases in CHANGELOG.md
    needs: [version, release]
    if: >-
      always() && !cancelled() && github.repository == 'setdef/Lota'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    continue-on-error: true
    concurrency:
      group: ${{ github.workflow }}-changelog
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Trunk as it is now, not this run's commit, and every tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      # Plain Ruby: Release#record needs no bundle.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - name: Record each release without a section, and push it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          record='text, recorded = Release.new(root: Dir.pwd).record; File.write("CHANGELOG.md", text); print recorded.join(" ")'
          for attempt in 1 2 3; do
            git fetch --quiet --tags "$remote" "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            git checkout --quiet --force --detach "origin/$DEFAULT_BRANCH"
            recorded=$(ruby -r ./tasks/release -e "$record")
            if [ -z "$recorded" ]; then
              echo "CHANGELOG.md has a section for every release tag"
              exit 0
            fi
            git --no-pager diff
            read -r -a versions <<< "$recorded"
            tags=$(printf 'v%s ' "${versions[@]}")
            cat > "$RUNNER_TEMP/message" <<EOF
          chore: record ${tags% } in the changelog

          CI released ${tags% } from a commit a green full run proved,
          wherever trunk had moved, and wrote nothing to trunk to do it. This
          catches CHANGELOG.md up: the entries each release's commit added
          move out of [Unreleased] under its dated section, and the entries
          added since stay where they are.

          Release: ${tags% }
          Recorded-by: CI run $GITHUB_RUN_ID, job changelog
          Red-before-green: none (release bookkeeping)
          Provenance: requested
          EOF
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --all --file "$RUNNER_TEMP/message"
            if git push --quiet "$remote" "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              echo "::notice::Recorded ${tags% } in CHANGELOG.md on $DEFAULT_BRANCH as $(git rev-parse HEAD)"
              exit 0
            fi
            echo "$DEFAULT_BRANCH moved on before the push (attempt $attempt); trying again on top of it"
            sleep $((attempt * 10))
          done
          echo "::warning::Could not push the changelog's record of ${tags% }; the next full run on $DEFAULT_BRANCH tries again"

      # The sections this run left, checked against the tags: a section
      # CI wrote lists what its release added, and one from before CI
      # recorded releases is word for word its tag's.
      - name: Check the changelog against the tags
        run: |
          ruby -r ./tasks/release -e 'problems = Release.new(root: Dir.pwd).check_changelog; abort problems.join("\n") unless problems.empty?'
