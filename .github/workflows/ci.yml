# SPDX-License-Identifier: AGPL-3.0-or-later

# The gate contributors run, bundle exec rake, on every push and pull
# request; then the precompiled gem it builds, installed on a fresh runner
# and run from there (Plan 001, the walking skeleton: "Continuous
# integration" and "Delivery"), once for each platform Lota ships a gem
# for: Apple Silicon macOS, Linux on x86_64 and arm64 (Plan 001, story 6),
# and Windows on x64 and ARM64 (ADR 002, section 4), whose jobs build the
# engine and check it without the gate, which needs windows (the Windows
# jobs say why). The macOS, Linux, and Windows jobs run side by side.
#
# macOS: LÖVE's own CI runs its tests on macOS runners with the normal
# video driver (vendor/love/.github/workflows/main.yml, the macOS job),
# since SDL's offscreen driver cannot create a Metal or OpenGL context on
# macOS; Lota's tests open real windows too. Every macOS job runs on
# macos-15: Apple Silicon, macOS 15 (actions/runner-images README,
# "Available Images"), the oldest macOS Lota supports (ADR 002, section
# 3), named rather than macos-latest, which moves to each new macOS. The
# image logs its user in to a GUI session at boot
# (images/macos/scripts/build/configure-autologin.sh, which
# templates/macOS-15.arm64.anka.pkr.hcl runs), so windows open as on a
# contributor's Mac.
#
# Linux: LÖVE's own Linux CI (the same workflow's Linux job) installs its
# build packages with apt, builds every dependency from source with
# love2d/love-appimage-source's Makefile, and runs Lövetest under Xvfb
# with Openbox, on OpenGL through Mesa's software renderer; Lota's Linux
# jobs do the same (tasks/linux_build.rb), on Ubuntu 22.04 for both x86_64
# and arm64, so both gems need the same glibc, 2.35. LÖVE's arm64 job runs
# on ubuntu-24.04-arm, whose glibc, 2.39, would leave out every system
# older than Ubuntu 24.04 for the arm64 gem alone.
#
# Release: a tag such as v0.1.0, pushed on a commit of trunk, runs all of
# the above again on that commit, and the release job publishes a GitHub
# release of the gems the delivery jobs installed and ran, but only when
# every platform's gate (on Windows, its build) and delivery passed. A
# release is a promise about
# each platform it lists, and one missing a platform would leave the
# games that depend on it there with nothing to install
# (doc/contributors/releasing.md). Run by hand (workflow_dispatch), the
# release job is a dry run: it checks and assembles the release that
# lib/lota/version.rb names, and keeps it as an artifact instead.

name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]*"
  pull_request:
  workflow_dispatch:
    inputs:
      ignore_gate_failures:
        description: >-
          Test only: build, deliver, and assemble the gems even where a
          gate fails, to try the release job. Refused on a tag.
        type: boolean
        default: false

permissions:
  contents: read

# A trunk run is never cancelled, so every release candidate on trunk
# finishes and can be tagged; a branch run gives way to a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

defaults:
  run:
    shell: bash

env:
  # Ruby comes from ruby/setup-ruby, not mise, so mise ignores the Ruby in
  # mise.toml, and the Rust it pins only for compiling that Ruby.
  # mise.toml has mise compile Ruby with ruby-build, since jdx/ruby's
  # precompiled macOS build passes --enable-yjit and installs Rust 1.58
  # (libexec/package.rb), too old for Ruby's ZJIT check (configure.ac's
  # "prerequisites for ZJIT", which needs Rust 1.85 or newer, for the 2024
  # edition), so it has no ZJIT, and ruby --zjit only warns and runs the
  # interpreter. setup-ruby's Ruby is built by ruby-build with the
  # runner's Rust (ruby/ruby-builder, .github/workflows/build.yml), as a
  # Ruby mise compiles is, and has both JITs, which rake bench measures,
  # without compiling Ruby on every run.
  MISE_DISABLE_TOOLS: ruby,rust
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"
  # Every parity test runs the reference love here, and keeps nothing
  # (test/parity/reference_cache.rb). A cache carried from one run to the
  # next by actions/cache would hit only when the reference love built
  # anew is the same file byte for byte, on a runner image the same down
  # to its packages, its displays, and its environment, which the key
  # names; a miss would still cost uploading and downloading every frame.
  # The gate runs once a job, so a cache kept for the job would only be
  # written, never read.
  LOTA_PARITY_CACHE: "0"

jobs:
  gate:
    name: Gate
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      # The engine builds from vendor/love and links the frameworks in
      # vendor/love-apple-dependencies.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # The tests open real windows, which needs an Aqua session.
      - name: Report the GUI session
        run: echo "launchctl managername is $(launchctl managername)"

      # The Ruby version mise.toml pins, which setup-ruby reads from it.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      # mise.toml pins the other tools contributors use (bin/setup), the
      # REUSE tool among them; CI installs the same pins the same way. Its
      # cache is keyed by mise.toml's hash.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11

      # Bundler and ccache keep their files outside the checkout, where
      # RuboCop and the REUSE tool would read them.
      - name: Place Bundler and ccache outside the checkout
        id: paths
        run: |
          {
            echo "BUNDLE_PATH=$HOME/.cache/lota/bundle"
            echo "CCACHE_DIR=$HOME/.cache/lota/ccache"
          } >> "$GITHUB_ENV"
          echo "ruby=$(ruby -rdigest -e 'print RUBY_VERSION, "-", RUBY_PLATFORM, "-", Digest::SHA256.hexdigest(RbConfig::CONFIG["configure_args"])[0, 16]')" >> "$GITHUB_OUTPUT"
          echo "submodules=$(git submodule status | shasum -a 256 | cut -c 1-16)" >> "$GITHUB_OUTPUT"

      # Gems with native extensions compile against one Ruby on one macOS,
      # so the key names both, with the lockfile. Ruby's version and
      # platform do not tell one build of it from another, so the key also
      # hashes the arguments Ruby was configured with. Only an exact match
      # restores.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/bundle
          key: gems-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      # The source archives the precompiled gem carries beside the
      # frameworks whose licenses ask for them (ext/lota/licenses.rb),
      # downloaded once and checked by their SHA-256, so the gate itself
      # needs no network.
      - name: Fetch the source archives
        run: bundle exec rake sources:fetch

      # ccache reuses an object only when the compiler, its arguments, the
      # source, and every header it includes hash the same, so any earlier
      # cache is safe to start from; a cache of the build tree would not be,
      # and would rebuild everything anyway, since the checkout gives every
      # source a new mtime. Apple's compilers sit behind xcrun shims, so
      # the compiler is identified by its version output, not its file.
      - name: Compile through ccache
        run: |
          {
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_COMPILERCHECK=%compiler% -v"
            echo "CCACHE_MAXSIZE=2G"
            for language in C CXX OBJC OBJCXX; do echo "CMAKE_${language}_COMPILER_LAUNCHER=ccache"; done
          } >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-
      - name: Zero ccache's statistics
        run: ccache --zero-stats

      # Minitest prints each test's name and time (A is Minitest::TestTask's
      # argument variable), so a stuck test shows which it is. The gate's
      # test:parity builds the reference love from vendor/love with LÖVE's
      # own macOS CI commands, through the ccache configured above, and
      # runs each fixture game in it and in Lota (tasks/reference_love.rb,
      # test/parity). The runner's default Xcode builds it.
      #
      # A dry run may go on past a failing gate, but never on a tag (the
      # ignore_gate_failures input).
      #
      # The gate ends a lane that runs past its budget, which it derives
      # from this step's 55 minutes, after printing what the lane was doing
      # (Gate::LANE_TIMEOUT in tasks/gate.rb), so a check that hangs fails
      # with its processes' stacks printed instead of being stopped here
      # with nothing printed. The steps before this one have taken under
      # two minutes, and those after a failed gate under one, within the
      # job's 60.
      - name: Run the gate
        timeout-minutes: 55
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_gate_failures && github.ref_type == 'branch' }}
        env:
          A: --verbose
        run: bundle exec rake

      # The gate starts with lint:fix, which corrects RuboCop offenses and
      # adds missing license headers, so an offense would pass as a fix
      # nobody committed. A changed or new file fails here instead.
      - name: Fail if the gate changed a file
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff
            echo "::error::bundle exec rake changed files; run it locally and commit what it changes"
            exit 1
          fi

      # The first frame that differed in each parity run that failed, as
      # LÖVE and Lota showed it (test/parity/probe.rb).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: parity-mismatches-arm64-darwin
          path: tmp/parity-mismatches
          if-no-files-found: ignore
          retention-days: 14

      # xcodebuild's log of the reference love, for a build that failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reference-love-build-log
          path: tmp/reference/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report ccache's statistics
        if: always()
        run: ccache --show-stats

      # Only the default branch saves, so branches start from its cache
      # without crowding it out.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.ref_name == github.event.repository.default_branch
        with:
          path: ~/.cache/lota/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-${{ github.run_id }}

      # The gem's SHA-256 travels with it, so the delivery job installs
      # the gem this job built, and a release publishes the gem the
      # delivery job installed, byte for byte.
      - name: Build the precompiled gem
        run: |
          bundle exec rake package:native
          cd pkg
          for gem in lota-*-arm64-darwin.gem; do shasum -a 256 "$gem" > "$gem.sha256"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lota-arm64-darwin
          path: pkg/lota-*-arm64-darwin.gem*
          if-no-files-found: error
          retention-days: 14

  # The gem the gate built, on a runner that never built it: no engine
  # build, no compiled bundle in lib/. The checkout holds the tasks that
  # check the gem and the games they run; Lota comes only from the gem.
  # rake package:deliver installs the gem with gem install --local into an
  # empty GEM_HOME, and runs every child process with no Bundler, no
  # RUBYLIB, and no other gem. lota run then runs two games: one that opens
  # a window, clears it, and quits with status 3, and test/lovetest/game,
  # Lövetest's love.test.graphics.clear translated, compared with LÖVE's
  # expected image by Lövetest's rule (Plan 001's "Done when"). A guard
  # loaded into each run fails it if anything loads from the checkout's
  # lib/, and dyld's report must show Lota's bundle and SDL3 loading from
  # the installed gem (tasks/package_check.rb). bundle exec rake
  # package:install runs the same check locally, on a gem it builds first.
  #
  # The expected image is in vendor/love/testing/output/expected, so only
  # that submodule is fetched, at depth 1: it holds no Ruby, and
  # vendor/love-apple-dependencies, whose frameworks the gem carries, stays
  # out, so SDL3 can only load from the gem.
  delivery:
    name: Delivery
    needs: gate
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch LÖVE's expected images
        run: git submodule update --init --depth 1 vendor/love

      - name: Report the GUI session
        run: echo "launchctl managername is $(launchctl managername)"

      # The same Ruby the gate built the gem with.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/lota/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -rdigest -e 'print RUBY_VERSION, "-", RUBY_PLATFORM, "-", Digest::SHA256.hexdigest(RbConfig::CONFIG["configure_args"])[0, 16]')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/bundle
          key: gems-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lota-arm64-darwin
          path: ${{ runner.temp }}/gem

      - name: Check the gem is the one the gate built
        working-directory: ${{ runner.temp }}/gem
        run: shasum -a 256 --check ./*.sha256

      - name: Install the gem and run Lövetest from it
        run: |
          gems=$(IFS=,; files=("$RUNNER_TEMP"/gem/*.gem); echo "${files[*]}")
          bundle exec rake "package:deliver[$gems]"

      # What a release publishes for this platform (the release job): the
      # gem just installed and run, unchanged by it.
      - name: Check the gem is still the one the gate built
        working-directory: ${{ runner.temp }}/gem
        run: shasum -a 256 --check ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-lota-arm64-darwin
          path: ${{ runner.temp }}/gem/lota-*
          if-no-files-found: error
          retention-days: 14

  # The gate on Linux, on x86_64 and on arm64. LÖVE's Linux CI installs
  # these packages to build SDL, OpenAL Soft, and LÖVE (main.yml's Linux
  # job, "Install Dependencies"), and runs Lövetest on a virtual display;
  # the gate builds the same libraries the same way (tasks/linux_build.rb)
  # and opens its windows there. The libraries and what they build from are
  # cached by the Makefile and recipe that build them, so a run rebuilds
  # them only when either changes.
  linux-gate:
    name: Gate (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: x86_64-linux-gnu
          - runner: ubuntu-22.04-arm
            platform: aarch64-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # The display Xvfb serves, as LÖVE's Linux job names it.
      DISPLAY: ":99"
      # The parity harness's own display, where no window of the gate's
      # other checks, which run at the same time, opens over its runs and
      # takes the pointer moves its scripts make (Parity.display).
      LOTA_PARITY_DISPLAY: ":98"
      # A display for each of the gate's lanes but the last, whose checks
      # open no window, in the order of tasks/gate.rake's lanes, so that no
      # lane's windows open over another's and take the pointer moves its
      # tests make (tasks/gate.rb); the parity harness's lane has its own.
      LOTA_GATE_DISPLAYS: ":99 :97 :96 :98"
    steps:
      # The engine builds from vendor/love, and its dependencies with
      # vendor/love-appimage-source's Makefile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # main.yml's Linux job, "Install Dependencies", word for word but for
      # its Vulkan driver, which only its Vulkan tests use, with Xvfb, which
      # it finds on the runner already, libyaml's development files, which
      # Bundler compiles psych against, and GCC 12's libstdc++ headers for
      # clang-tidy (rake cpp:tidy), which reads the newest it finds: its
      # analyzer follows GCC 12's std::shared_ptr, and reports a leak in
      # every Rice::Object it reads through GCC 11's, the compiler's own.
      - name: Install LÖVE's Linux build dependencies
        run: |
          sudo apt-get update
          bin/apt-packages list build runner | xargs sudo apt-get install --assume-yes

      # main.yml's "Start xvfb and openbox", with a screen that holds the
      # tests' windows: LÖVE's 360x240 is smaller than the 800x600 window
      # a game opens by default. Every lane's display, the parity
      # harness's and DISPLAY among them, is the same.
      - name: Start Xvfb and Openbox
        run: |
          read -r -a displays <<< "$LOTA_GATE_DISPLAYS"
          for display in "${displays[@]}"; do
            Xvfb "$display" -screen 0 1280x1024x24 &
          done
          sleep 3
          for display in "${displays[@]}"; do
            DISPLAY="$display" openbox &
          done

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11

      - name: Place Bundler and ccache outside the checkout
        id: paths
        run: |
          {
            echo "BUNDLE_PATH=$HOME/.cache/lota/bundle"
            echo "CCACHE_DIR=$HOME/.cache/lota/ccache"
          } >> "$GITHUB_ENV"
          echo "ruby=$(ruby -rdigest -e 'print RUBY_VERSION, "-", RUBY_PLATFORM, "-", Digest::SHA256.hexdigest(RbConfig::CONFIG["configure_args"])[0, 16]')" >> "$GITHUB_OUTPUT"
          echo "submodules=$(git submodule status | sha256sum | cut -c 1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/bundle
          key: gems-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      # What love-appimage-source's Makefile downloads, which rake
      # sources:fetch keeps in vendor/sources/linux, and the libraries rake
      # dependencies builds from it in tmp/dependencies, each keyed by what
      # makes it: the Makefile, and for the libraries the recipe too. The
      # recipe checks the compiler itself, and builds again if the runner's
      # has changed. The downloads are keyed by the runner's processor too,
      # because the Makefile downloads the CMake for the machine it runs on.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/sources/linux
          key: linux-sources-${{ runner.arch }}-${{ hashFiles('vendor/love-appimage-source/Makefile') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/dependencies
          key: linux-dependencies-${{ matrix.runner }}-${{ hashFiles('vendor/love-appimage-source/Makefile', 'tasks/linux_build.rb') }}

      # The source archives the precompiled gem carries, and on Linux what
      # LÖVE's dependencies build from, so the gate itself needs no network.
      - name: Fetch the sources
        run: bundle exec rake sources:fetch

      # As on macOS; GCC is not behind a shim, so ccache's default check of
      # the compiler's file serves.
      - name: Compile through ccache
        run: |
          {
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=2G"
            for language in C CXX; do echo "CMAKE_${language}_COMPILER_LAUNCHER=ccache"; done
          } >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-
      - name: Zero ccache's statistics
        run: ccache --zero-stats

      # The gate's test:parity builds the reference love from vendor/love
      # with love-appimage-source's Makefile, as LÖVE's own Linux CI does,
      # beside the dependencies.
      - name: Run the gate
        timeout-minutes: 100
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_gate_failures && github.ref_type == 'branch' }}
        env:
          A: --verbose
        run: bundle exec rake

      - name: Fail if the gate changed a file
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff
            echo "::error::bundle exec rake changed files; run it locally and commit what it changes"
            exit 1
          fi

      # The first frame that differed in each parity run that failed, as
      # LÖVE and Lota showed it (test/parity/probe.rb).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: parity-mismatches-${{ matrix.platform }}
          path: tmp/parity-mismatches
          if-no-files-found: ignore
          retention-days: 14

      # The log of the dependencies' and the reference love's build, for a
      # build that failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-build-log-${{ matrix.platform }}
          path: tmp/dependencies/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report ccache's statistics
        if: always()
        run: ccache --show-stats

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.ref_name == github.event.repository.default_branch
        with:
          path: ~/.cache/lota/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-${{ github.run_id }}

      - name: Build the precompiled gem
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          bundle exec rake package:native
          cd pkg
          for gem in lota-*-"$PLATFORM".gem; do sha256sum "$gem" > "$gem.sha256"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lota-${{ matrix.platform }}
          path: pkg/lota-*-${{ matrix.platform }}.gem*
          if-no-files-found: error
          retention-days: 14

  # The Linux gem the gate built, on a runner that never built it, as the
  # macOS delivery job does: none of the packages LÖVE's build installs,
  # only what a player's desktop has, a display and Mesa's OpenGL, and
  # nothing of LÖVE's but its expected images. The gem carries every
  # library LÖVE's Linux build makes, and relies on the system for glibc,
  # the C++ runtime, X11, and OpenGL, which SDL loads when it starts.
  linux-delivery:
    name: Delivery (${{ matrix.platform }})
    needs: linux-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: x86_64-linux-gnu
          - runner: ubuntu-22.04-arm
            platform: aarch64-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch LÖVE's expected images
        run: git submodule update --init --depth 1 vendor/love

      # A desktop's display server and OpenGL, not their development files,
      # and libyaml's, which Bundler compiles psych against for the bundle
      # that runs the check.
      - name: Install a display and OpenGL
        run: |
          sudo apt-get update
          bin/apt-packages list display | xargs sudo apt-get install --assume-yes

      - name: Start Xvfb and Openbox
        run: |
          Xvfb "$DISPLAY" -screen 0 1280x1024x24 &
          sleep 3
          openbox &

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/lota/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -rdigest -e 'print RUBY_VERSION, "-", RUBY_PLATFORM, "-", Digest::SHA256.hexdigest(RbConfig::CONFIG["configure_args"])[0, 16]')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/bundle
          key: gems-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lota-${{ matrix.platform }}
          path: ${{ runner.temp }}/gem

      - name: Check the gem is the one the gate built
        working-directory: ${{ runner.temp }}/gem
        run: sha256sum --check ./*.sha256

      - name: Install the gem and run Lövetest from it
        run: |
          gems=$(IFS=,; files=("$RUNNER_TEMP"/gem/*.gem); echo "${files[*]}")
          bundle exec rake "package:deliver[$gems]"

      - name: Check the gem is still the one the gate built
        working-directory: ${{ runner.temp }}/gem
        run: sha256sum --check ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-lota-${{ matrix.platform }}
          path: ${{ runner.temp }}/gem/lota-*
          if-no-files-found: error
          retention-days: 14

  # Lota on Windows (ADR 002, section 4; Plan 002, item 10): LÖVE's
  # dependencies built from source at LÖVE's versions (tasks/windows_build.rb),
  # LÖVE's engine and Lota's extension built with MinGW against
  # RubyInstaller's UCRT Ruby, the extension's closure of DLLs checked, its
  # DLLs shown to load from the gem's own directory and nowhere else, the
  # tests that open no window and need no test-only extension run from a
  # PATH a player's machine might have, and the precompiled gem built. x64
  # builds with MSYS2's UCRT64 environment (GCC), ARM64 with its CLANGARM64
  # environment (clang), the toolchains RubyInstaller builds its Ruby with
  # for each. A runner has no GPU, and Windows' own OpenGL is 1.1, which
  # LÖVE's renderer cannot use, so the one window opened here shows only
  # that SDL makes an OpenGL context; the gate (bundle exec rake), whose
  # tests draw, does not run on Windows.
  windows-build:
    name: Windows build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: x64-mingw-ucrt
            msystem: UCRT64
            compiler: gcc:p
            cc: gcc
            cxx: g++
            ccache: D:/ccache
          # RubyInstaller's ARM64 Ruby is built with MSYS2's CLANGARM64
          # environment, which has no GCC.
          - runner: windows-11-arm
            platform: aarch64-mingw-ucrt
            msystem: CLANGARM64
            compiler: clang:p lld:p llvm-tools:p
            cc: clang
            cxx: clang++
            ccache: C:/ccache
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ matrix.ccache }}
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      # The runner's Git converts line endings, which would keep
      # physics.patch from applying to LÖVE's sources.
      - name: Keep line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch LÖVE's sources
        shell: pwsh
        run: git submodule update --init --depth 1 vendor/love

      # RubyInstaller's Ruby, built with MinGW against the UCRT.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "4.0"
          windows-toolchain: none

      # The toolchain alone: every library LÖVE links is built from source.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          install: patch make
          pacboy: ${{ matrix.compiler }} cmake:p ninja:p ccache:p

      # The REUSE tool, at the version mise.toml pins, which checks the
      # gem's licensing as it is built (tasks/native_gem.rb), into the
      # runner's Python.
      - name: Install the REUSE tool
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "reuse[charset-normalizer]==6.2.0"

      - name: Report the toolchain and Ruby
        id: toolchain
        run: |
          set -x
          which $CC $CXX cmake ninja patch make ruby reuse strip
          $CXX --version
          cmake --version
          ruby -v
          ruby -e 'c = RbConfig::CONFIG; %w[arch host_os host_cpu DLEXT CC CXX libdir LIBRUBY].each { |k| puts "#{k}=#{c[k]}" }; puts "Gem::Platform.local=#{Gem::Platform.local}"'
          echo "compiler=$($CC --version | head -1 | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"

      # The archives and what they build, kept while the recipe and the
      # compiler stay the same (the stamp tasks/windows_build.rb checks).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dependencies
        with:
          path: |
            vendor/sources/windows
            tmp/dependencies/installdir
            tmp/dependencies/dependencies.stamp
          key: windows-dependencies-${{ matrix.platform }}-${{ steps.toolchain.outputs.compiler }}-${{ hashFiles('tasks/windows_build.rb', 'tasks/source_archive.rb') }}

      # Kept out of ccache, whose cache is the engine's and the extension's.
      - name: Build LÖVE's dependencies from source
        env:
          CMAKE_C_COMPILER_LAUNCHER: ""
          CMAKE_CXX_COMPILER_LAUNCHER: ""
        run: |
          start=$(date +%s)
          ruby -e 'require "./tasks/windows_build"
            build = WindowsBuild.new(sources: WindowsBuild::SOURCES, root: "tmp/dependencies")
            build.fetch
            build.dependencies'
          echo "dependencies ready in $(( $(date +%s) - start ))s"
          ls -l tmp/dependencies/installdir/lib tmp/dependencies/installdir/bin

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            vendor/sources/windows
            tmp/dependencies/installdir
            tmp/dependencies/dependencies.stamp
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Describe what OpenAL Soft compiled
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: ruby .github/windows_checks.rb notices tmp/dependencies/build/openal-soft-1.24.3 tmp/dependencies/src/openal-soft-1.24.3

      # sources_windows.cmake is LÖVE's CMake evaluated on Windows, as
      # rake engine:sources:check checks the other platforms' lists.
      - name: Check the engine's source list
        run: |
          ruby -e 'require "./tasks/engine_sources"
            commit = `git -C vendor/love rev-parse HEAD`.strip
            s = EngineSources.new(source: "vendor/love", build: "tmp/engine/sources/windows",
              cmake_args: EngineSources.cmake_args("windows"), label: EngineSources.label(commit, "windows"))
            problems = s.problems("ext/lota/engine/sources_windows.cmake")
            abort problems.join("\n") unless problems.empty?
            puts "ext/lota/engine/sources_windows.cmake matches vendor/love"'

      - name: Install Rice
        run: gem install rice -v 4.12.0 --no-document

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.ccache }}
          key: ccache-windows-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache-windows-${{ matrix.platform }}-

      - name: Configure through extconf.rb
        run: |
          ccache --zero-stats
          mkdir -p tmp/ext
          cd tmp/ext
          ruby ../../ext/lota/extconf.rb "--with-cmake-build-dir=$(cygpath -m "$GITHUB_WORKSPACE/tmp/engine/build")"

      - name: Build the engine and the extension
        run: |
          start=$(date +%s)
          make -C tmp/ext install sitearchdir="$PWD/lib"
          echo "built in $(( $(date +%s) - start ))s"
          ccache --show-stats
          ls -l lib/lota/*.so lib/lota/libraries

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.ref_name == github.event.repository.default_branch
        with:
          path: ${{ matrix.ccache }}
          key: ccache-windows-${{ matrix.platform }}-${{ github.run_id }}

      - name: Check that Lota's code still warns as errors
        run: ruby .github/windows_checks.rb werror tmp/engine/build/compile_commands.json

      - name: Check the extension's DLLs
        run: ruby .github/windows_checks.rb closure lib/lota/native.so lib/lota/preload.so lib/lota/libraries/OpenAL32.dll

      # Each load runs with a PATH of only Ruby and Windows, as a player's
      # machine might have, and with a decoy OpenAL32.dll, a DLL of
      # Windows' own renamed, wherever a same-named DLL could be found:
      # first on PATH, in a directory RubyInstaller::Runtime.add_dll_directory
      # adds, and in each MSYS2 that RubyInstaller::Runtime.enable_msys_apps
      # could add, the one this job set up (which RubyInstaller finds
      # beside its Ruby) and the one installed on the runner (C:/msys64),
      # as a player's might be. A decoy that loaded would leave Lota without
      # OpenAL's functions. The decoys come out again, so the gem built
      # below cannot carry one.
      - name: Load Lota's DLLs from Lota's own directory
        timeout-minutes: 6
        run: |
          mkdir -p tmp/decoy
          cp /c/Windows/System32/version.dll tmp/decoy/OpenAL32.dll
          clean="$(cygpath -u "$(dirname "$(which ruby)")"):/c/Windows/system32:/c/Windows"
          decoy=$(cygpath -w "$PWD/tmp/decoy")
          decoys=()
          for msys in "$MINGW_PREFIX/bin" /c/msys64/ucrt64/bin /c/msys64/clangarm64/bin /c/msys64/mingw64/bin; do
            [ -d "$msys" ] && cp /c/Windows/System32/version.dll "$msys/OpenAL32.dll" && decoys+=("$msys/OpenAL32.dll") && echo "decoy in $msys"
          done
          echo "== with Lota's preloader"
          PATH="$PWD/tmp/decoy:$clean" /usr/bin/timeout -k 5 120 ruby .github/windows_checks.rb load preload "$decoy"
          echo "== without it, as a control: the decoy alone answers for OpenAL32.dll"
          status=0
          PATH="$PWD/tmp/decoy:$clean" /usr/bin/timeout -k 5 120 ruby .github/windows_checks.rb load bare "$decoy" || status=$?
          rm -rf tmp/decoy "${decoys[@]}"
          [ "$status" = 3 ] || { echo "the control exited $status, not 3"; exit 1; }

      # A restart replaces the process with lota run again; on Windows,
      # Ruby's exec starts it as a new process (windows_checks.rb).
      - name: Restart a game
        timeout-minutes: 4
        run: |
          clean="$(cygpath -u "$(dirname "$(which ruby)")"):/c/Windows/system32:/c/Windows"
          PATH="$clean" /usr/bin/timeout -k 5 180 ruby .github/windows_checks.rb restart

      # A window with OpenGL: Windows' own opengl32.dll gives the runner
      # OpenGL 1.1, which the engine refuses, so this shows that SDL could
      # make an OpenGL context on each architecture, not that a game draws.
      - name: Open a window with OpenGL
        timeout-minutes: 4
        run: |
          clean="$(cygpath -u "$(dirname "$(which ruby)")"):/c/Windows/system32:/c/Windows"
          PATH="$clean" /usr/bin/timeout -k 5 180 ruby .github/windows_checks.rb opengl

      # The PATH adds the directory of Git for Windows' commands, which holds
      # no DLL, since the gemspec the version test loads lists its files
      # with git. A dry run may go on past a failing test, but never on a
      # tag (the ignore_gate_failures input).
      - name: Run the headless tests
        timeout-minutes: 15
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_gate_failures && github.ref_type == 'branch' }}
        run: |
          gem install minitest -v '~> 6.0' --no-document
          clean="$(cygpath -u "$(dirname "$(which ruby)")"):/c/Windows/system32:/c/Windows:/c/Program Files/Git/cmd"
          status=0
          for test in test/version_test.rb test/info_test.rb test/error_message_test.rb test/settings_test.rb \
            test/record_test.rb test/deprecation_test.rb test/boot_test.rb test/callbacks_test.rb \
            test/variant_test.rb test/restart_test.rb; do
            echo "== $test"
            code=0
            PATH="$clean" /usr/bin/timeout -k 5 180 ruby -Ilib -Itest "$test" > tmp/test.log 2>&1 || code=$?
            tail -15 tmp/test.log
            [ "$code" = 0 ] || { echo "== $test exited $code"; status=1; }
          done
          exit $status

      # The gem's SHA-256 travels with it, as on the other platforms. The
      # package check builds it from what this job built, with the gem's
      # REUSE record checked, and its binaries read for the DLLs they
      # import (NativeFormat::PE), without Bundler (windows_checks.rb).
      - name: Build the precompiled gem
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          ruby .github/windows_checks.rb package
          cd pkg
          for gem in lota-*-"$PLATFORM".gem; do sha256sum "$gem" > "$gem.sha256"; cat "$gem.sha256"; ls -l "$gem"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lota-${{ matrix.platform }}
          path: pkg/lota-*-${{ matrix.platform }}.gem*
          if-no-files-found: error
          retention-days: 14

  # The Windows gem the build job built, on a runner that never built it,
  # as the macOS and Linux delivery jobs do: RubyInstaller's Ruby and the
  # repository's tasks, without MSYS2, the dependencies, or the engine,
  # and with a PATH of only Ruby, Windows, Windows PowerShell, which the
  # guard asks for the modules a run loaded, and Git, with which the check
  # lists the repository's files. It installs the gem into an empty
  # GEM_HOME and runs lota from it (tasks/package_check.rb): lota
  # --version, every Ruby file loaded from the installed gem, and a game
  # that opens no window and plays a sound through the gem's OpenAL32.dll
  # (WINDOWLESS_GAME in tasks/package.rake), with Lota, the bundle, the
  # preloader, and OpenAL32.dll loaded from the installed gem.
  windows-delivery:
    name: Delivery (${{ matrix.platform }})
    needs: windows-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: x64-mingw-ucrt
          - runner: windows-11-arm
            platform: aarch64-mingw-ucrt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "4.0"
          windows-toolchain: none

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lota-${{ matrix.platform }}
          path: ${{ runner.temp }}/gem

      - name: Check the gem is the one the build job built
        working-directory: ${{ runner.temp }}/gem
        run: sha256sum --check ./*.sha256

      - name: Install the gem and run a game from it
        run: |
          clean="$(dirname "$(which ruby)"):/c/Windows/system32:/c/Windows:/c/Windows/System32/WindowsPowerShell/v1.0:/c/Program Files/Git/cmd"
          gems=("$RUNNER_TEMP"/gem/*.gem)
          PATH="$clean" ruby .github/windows_checks.rb deliver "${gems[@]}"

      - name: Check the gem is still the one the build job built
        working-directory: ${{ runner.temp }}/gem
        run: sha256sum --check ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-lota-${{ matrix.platform }}
          path: ${{ runner.temp }}/gem/lota-*
          if-no-files-found: error
          retention-days: 14

  # The release (doc/contributors/releasing.md), from the gems the
  # delivery jobs installed and ran, never rebuilt. It runs for a tag
  # v0.1.0 pushed to this repository, and by hand as a dry run; never for
  # a pull request, and never in a fork. It needs every platform's gate
  # and delivery to have passed, so a tag on a commit where any platform
  # failed publishes nothing; rerun the failed jobs, or fix the commit and
  # tag the fix with the next version. Its token alone may write, and only
  # the repository's contents, which a GitHub release is; it uses no other
  # secret. A new platform joins with a job that builds its gem and a
  # delivery job that uploads it verified, as verified-lota-<platform>,
  # both in needs, and the platform in PLATFORMS.
  release:
    name: Release
    needs: [gate, delivery, linux-gate, linux-delivery, windows-build, windows-delivery]
    if: >-
      github.repository == 'setdef/Lota'
      && ((github.event_name == 'push' && github.ref_type == 'tag')
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # One gem for each, every one of which the release must carry.
      PLATFORMS: arm64-darwin x86_64-linux-gnu aarch64-linux-gnu x64-mingw-ucrt aarch64-mingw-ucrt
      PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - name: Refuse to publish past a failing gate
        if: inputs.ignore_gate_failures
        run: |
          if [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "::error::ignore_gate_failures is for a dry run on a branch, never a tag"
            exit 1
          fi
          echo "::warning::A dry run that ignored the gates' failures; a tag would publish nothing from this commit unless they pass"

      # Every branch and tag, to ask whether the commit is on trunk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A tag anyone with push access can put on any commit, so the
      # commit must already be on trunk, where the gate ran on it.
      - name: Check the commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "$GITHUB_SHA is on $DEFAULT_BRANCH"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on $DEFAULT_BRANCH; releases are cut from $DEFAULT_BRANCH"
            exit 1
          else
            echo "::warning::$GITHUB_SHA is not on $DEFAULT_BRANCH, so a tag on it would publish nothing"
          fi

      - name: Install libyaml
        run: |
          sudo apt-get update
          bin/apt-packages list bundle | xargs sudo apt-get install --assume-yes

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/lota/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -rdigest -e 'print RUBY_VERSION, "-", RUBY_PLATFORM, "-", Digest::SHA256.hexdigest(RbConfig::CONFIG["configure_args"])[0, 16]')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/bundle
          key: gems-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      # The tag must name lib/lota/version.rb's version, and CHANGELOG.md
      # must have a dated section for it, whose changes are the notes. A
      # dry run checks the tag the version would have.
      - name: Check the tag, the version, and the changelog
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$PUBLISH" != true ]; then
            TAG=v$(bundle exec ruby -r ./lib/lota/version -e 'print Lota::VERSION')
          fi
          bundle exec rake "release:check[$TAG]"
          bundle exec rake "release:notes[${TAG#v},$RUNNER_TEMP/notes.md]"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verified-lota-*
          merge-multiple: true
          path: ${{ runner.temp }}/release

      # Exactly one gem for each platform, each the one its delivery job
      # verified, and SHA256SUMS for them all.
      - name: Assemble the release
        run: |
          read -r -a platforms <<< "$PLATFORMS"
          bundle exec rake "release:assemble[$RUNNER_TEMP/release$(printf ',%s' "${platforms[@]}")]"
          cat "$RUNNER_TEMP/release/SHA256SUMS"

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Lota ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/release/*

      - name: Copy the notes beside the gems
        if: env.PUBLISH != 'true'
        run: cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH != 'true'
        with:
          name: release-dry-run-${{ steps.release.outputs.tag }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14
