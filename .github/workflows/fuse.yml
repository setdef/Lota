# lota fuse, for real, on each platform Lota ships a gem for
# (doc/contributors/design/packaging.md): on a runner of that platform it
# installs Lota's gem for it, fuses a game with this commit's lota fuse, which
# fetches Fledge from Git and runs fledge build, then unpacks the app it built
# under a folder named with a space, and runs it with no Ruby on its PATH and an
# environment of only the system's own variables. Each game plays a sound,
# saves a file, and quits with 3; the check reads that it ran fused and saved
# under its identity alone, where LÖVE's fused game saves
# (doc/contributors/design/game.md). test/games/fuse first restarts once, as
# LÖVE's fused game restarts, and the check reads that the value crossed and
# that the run after it was the same process on macOS and Linux and a new one
# on Windows. It then opens a window, draws the screen Lövetest's
# captureScreenshot test captures, and saves a screenshot, which the check
# compares with Lövetest's expected image by Lövetest's rule. A runner has no
# GPU, so it draws with Metal on macOS and on Mesa's llvmpipe elsewhere; the
# other games open no window. The entry script this commit's lota fuse
# writes calls the gem's Lota::Restart, so it fuses with gems of the same
# commit. Every app's notices are checked in the archive a player unpacks: the
# NOTICES.txt lota fuse writes, with Lota's own license statement, each library
# the gem carries, FreeType's credit, OpenAL Soft's source archive, and every
# path it names in the app.
#
# Three games are fused on every platform: test/games/fuse, with no
# Gemfile; test/games/fuse_gems, whose Gemfile asks for a gem of pure Ruby
# and whose committed Gemfile.lock locks an older version than the
# Gemfile allows, which the app must load; and test/games/fuse_native,
# whose Gemfile asks for Lota, from the game's vendor/cache, and for
# fast_blank, whose C extension compiles on the runner with the compiler
# it has: Xcode's command line tools on macOS, GCC on Ubuntu, and the
# MSYS2 toolchain setup-ruby installs on Windows (UCRT64 on x64,
# CLANGARM64 on ARM64). Its lockfile is written here, as the game's
# developer writes one, once Lota's gem is in its vendor/cache.
#
# On Linux and Windows the sound plays through OpenAL Soft's null backend,
# since those runners have no audio device. A macOS runner has a virtual
# one, so there the app runs as a player's would, without ALSOFT_DRIVERS,
# and the check reads OpenAL Soft's log (ALSOFT_LOGLEVEL=3) for CoreAudio,
# its backend named core, and a device opened through it.
#
# Another job fuses test/games/fuse_native in a container that has Ruby
# and no compiler, and checks that lota fuse fails there and says what to
# install, as a developer without one sees it.
#
# CI (ci.yml) calls it on every push, once its gate and build jobs have
# built each platform's gem, with this_run, so the gems are that run's
# lota-PLATFORM artifacts, checked against their .sha256 files. Run by
# hand, the gems are the lota-PLATFORM artifacts of the CI run gems_run
# names, checked the same way, or with no gems_run the release of the
# version this checkout is (lib/lota/version.rb), which lota fuse pins,
# checked against its SHA256SUMS. lota fuse runs from this checkout
# (ruby -I lib), and ships the installed gem it finds, as a developer's
# would. What each job built is kept as an artifact, fused-GAME-PLATFORM:
# the archive a player unpacks, and on Windows the setup program, on
# macOS the disk image, on Linux the AppImage.
#
# Run by hand with game_repository, it fuses that public repository's
# game instead, with identifier for its --identifier, and keeps what it
# built as fused-game-PLATFORM without running it, since a game that
# draws needs a GPU.
#
# Linux builds on Ubuntu 24.04, since Fledge's Linux runtime needs glibc
# 2.39 (its README, Compatibility), which Lota's gem, built on 22.04 for
# glibc 2.35, runs on too.

name: Fuse

on:
  workflow_call:
    inputs:
      this_run:
        description: Fuse with the lota-PLATFORM artifacts the calling run's jobs uploaded
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      gems_run:
        description: A CI run whose lota-PLATFORM artifacts to fuse with (empty for the release of this checkout's version)
        type: string
        default: ""
      game_repository:
        description: A public repository (OWNER/NAME) holding a game to fuse instead of test/games/fuse, which is built but not run
        type: string
        default: ""
      game_ref:
        description: The branch, tag, or commit of game_repository
        type: string
        default: ""
      game_path:
        description: The game's folder in game_repository
        type: string
        default: "."
      identifier:
        description: The app's identifier, for lota fuse --identifier (empty for its placeholder)
        type: string
        default: ""
      icon:
        description: The game's icon files without their extension, for lota fuse --icon (empty for none)
        type: string
        default: ""
      app_version:
        description: The app's version, for lota fuse --app-version (empty for Fledge's)
        type: string
        default: ""
      game_env:
        description: Variables for the drawing run of game_repository's game, as NAME=VALUE separated by spaces
        type: string
        default: ""

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  fuse:
    name: Fuse ${{ matrix.game }} (${{ matrix.target.platform }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: macos-15
            platform: arm64-darwin
          - runner: ubuntu-24.04
            platform: x86_64-linux-gnu
          - runner: ubuntu-24.04-arm
            platform: aarch64-linux-gnu
          - runner: windows-2025
            platform: x64-mingw-ucrt
          - runner: windows-11-arm
            platform: aarch64-mingw-ucrt
        # The games in test/games, or game_repository's, called game.
        game: ${{ fromJSON(inputs.game_repository && '["game"]' || '["fuse", "fuse_gems", "fuse_native"]') }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    env:
      PLATFORM: ${{ matrix.target.platform }}
      GEMS_RUN: ${{ inputs.gems_run }}
      GAME_NAME: ${{ matrix.game }}
      GAME: ${{ inputs.game_repository && format('game-source/{0}', inputs.game_path) || format('test/games/{0}', matrix.game) }}
      IDENTIFIER: ${{ inputs.identifier }}
      GAME_ENV: ${{ inputs.game_env }}
      ICON: ${{ inputs.icon }}
      APP_VERSION: ${{ inputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.game_repository
        with:
          repository: ${{ inputs.game_repository }}
          ref: ${{ inputs.game_ref }}
          path: game-source
          persist-credentials: false

      # test/games/fuse draws the screen Lövetest's captureScreenshot test
      # captures, with Lövetest's resources, and the check compares its
      # screenshot with Lövetest's expected image. Both are in LÖVE's
      # repository, so only that submodule is fetched, at depth 1.
      - name: Fetch Lövetest's resources and expected images
        if: matrix.game == 'fuse'
        run: git submodule update --init --depth 1 vendor/love

      # The OpenGL and EGL libraries SDL opens, which a desktop has and a
      # runner does not; Lota loads without a display. test/games/fuse
      # opens a window, so its job gets a desktop's display server too,
      # Xvfb with Openbox, and Mesa's OpenGL, as the Linux delivery jobs
      # do.
      - name: Install OpenGL's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes libgl1 libegl1
          [ "$GAME_NAME" != fuse ] || bin/apt-packages list display | xargs sudo apt-get install --assume-yes

      - name: Start Xvfb and Openbox
        if: runner.os == 'Linux' && matrix.game == 'fuse'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 3
          DISPLAY=:99 openbox &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # The Ruby mise.toml pins, and on Windows RubyInstaller's rolling head
      # build, since RubyInstaller publishes no Ruby 4.1 preview (ADR 013).
      # A game whose gems are pure Ruby needs no MSYS2 on Windows, as the
      # README says of a released RubyInstaller; one with a gem to compile,
      # or another repository's, gets the toolchain setup-ruby installs,
      # which RubyInstaller in Fledge's runtime finds through MSYS2_PATH, as
      # Fledge's own CI points it there. The head build loads its own zlib,
      # OpenSSL, libffi, and libyaml from MSYS2, so on Windows every game
      # gets the toolchain until RubyInstaller releases Ruby 4.1, and
      # setup-ruby installs no Bundler, whose gem install would need zlib.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ runner.os == 'Windows' && 'head' || 'default' }}
          windows-toolchain: default
          bundler: ${{ runner.os == 'Windows' && 'none' || 'Gemfile.lock' }}

      - name: Point RubyInstaller at setup-ruby's MSYS2
        if: runner.os == 'Windows' && matrix.game != 'fuse' && matrix.game != 'fuse_gems'
        run: echo "MSYS2_PATH=$RI_DEVKIT" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.this_run
        with:
          name: lota-${{ matrix.target.platform }}
          path: ${{ runner.temp }}/gems

      - name: Get Lota's gem for this platform, check it, and install it
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ inputs.this_run }}
        run: |
          sum() { if command -v sha256sum > /dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          gems="$RUNNER_TEMP/gems"
          mkdir -p "$gems"
          if [ "$THIS_RUN" = true ]; then
            (cd "$gems" && sum --check ./*.sha256)
          elif [ -n "$GEMS_RUN" ]; then
            gh run download "$GEMS_RUN" -R "$GITHUB_REPOSITORY" -n "lota-$PLATFORM" -D "$gems"
            (cd "$gems" && sum --check ./*.sha256)
          else
            version=$(sed -n 's/^ *VERSION = "\(.*\)"$/\1/p' lib/lota/version.rb)
            gh release download "v$version" -R "$GITHUB_REPOSITORY" -D "$gems" -p "lota-$version-$PLATFORM.gem" -p SHA256SUMS
            (cd "$gems" && grep " lota-$version-$PLATFORM.gem\$" SHA256SUMS | sum --check -)
          fi
          gem install --local "$gems"/lota-*-"$PLATFORM".gem
          gem list lota

      # As the README's Installation has a game with a Gemfile take Lota:
      # its gem in the game's vendor/cache, then the bundle locked.
      - name: Lock the game's gems, as its developer would
        if: matrix.game == 'fuse_native'
        run: |
          mkdir -p "$GAME/vendor/cache"
          cp "$RUNNER_TEMP"/gems/lota-*-"$PLATFORM".gem "$GAME/vendor/cache/"
          (cd "$GAME" && BUNDLE_GEMFILE="$PWD/Gemfile" bundle lock)
          cat "$GAME/Gemfile.lock"

      - name: lota fuse
        run: |
          start=$(date +%s)
          options=(--out "$RUNNER_TEMP/dist")
          [ -z "$IDENTIFIER" ] || options+=(--identifier "$IDENTIFIER")
          [ -z "$ICON" ] || options+=(--icon "$ICON")
          [ -z "$APP_VERSION" ] || options+=(--app-version "$APP_VERSION")
          ruby -I lib exe/lota fuse "$GAME" "${options[@]}" | tee "$RUNNER_TEMP/fuse.out"
          echo "lota fuse took $(( $(date +%s) - start )) s"
          echo "--- the project lota fuse wrote"
          project="$RUNNER_TEMP/dist/fuse-project"
          for file in Gemfile Gemfile.lock fledge.yml main.rb; do echo "=== $file"; cat "$project/$file"; done
          echo "=== NOTICES.txt"; head -c 4000 "$project/NOTICES.txt"; echo
          find "$project" -path "$project/vendor" -prune -o -type f -print
          ls -la "$RUNNER_TEMP/dist"

      # The notices lota fuse wrote into the app (Lota::Notices), read from
      # the archive a player unpacks: in the folder that holds the app's
      # app folder, which on macOS is the bundle's Contents/Resources.
      - name: Check the app's notices on macOS or Linux
        if: runner.os != 'Windows'
        run: |
          archive=$(ls "$RUNNER_TEMP"/dist/*.tar.gz)
          place="$RUNNER_TEMP/notices"
          mkdir -p "$place"
          tar -xzf "$archive" -C "$place"
          base=$(basename "$archive" .tar.gz)
          root="$place/$base"
          [ "$RUNNER_OS" != macOS ] || root="$root/${base%-"$PLATFORM"}.app/Contents/Resources"
          ruby .github/fuse_check.rb notices "$root" "$PLATFORM"

      - name: Check the app's notices on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/dist" -Filter '*.zip' | Select-Object -First 1
          $place = Join-Path $env:RUNNER_TEMP 'notices'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $place
          ruby .github/fuse_check.rb notices (Join-Path $place $zip.BaseName) $env:PLATFORM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the app on macOS or Linux, with no Ruby on its PATH
        if: runner.os != 'Windows' && !inputs.game_repository
        run: |
          archive=$(ls "$RUNNER_TEMP"/dist/*.tar.gz)
          place="$RUNNER_TEMP/run/My Games"
          mkdir -p "$place" "$RUNNER_TEMP/empty"
          tar -xzf "$archive" -C "$place"
          root="$place/$(basename "$archive" .tar.gz)"
          # Fledge names the archive NAME-PLATFORM, with Linux's platform
          # without -gnu.
          name=$(basename "$root"); name="${name%-"${PLATFORM%-gnu}"}"
          if [ "$RUNNER_OS" = macOS ]; then
            program="$root/$name.app/Contents/MacOS/$name"
            audio=(ALSOFT_LOGLEVEL=3)
            backend=("$RUNNER_TEMP/run.err" core)
          else
            program="$root/$name"
            audio=(ALSOFT_DRIVERS=null)
            backend=()
          fi
          display=()
          [ -z "${DISPLAY:-}" ] || display=(DISPLAY="$DISPLAY")
          set +e
          (cd / && env -i PATH="$RUNNER_TEMP/empty" HOME="$HOME" "${display[@]}" "${audio[@]}" "$program" > "$RUNNER_TEMP/run.out" 2> "$RUNNER_TEMP/run.err")
          status=$?
          set -e
          echo "exit status: $status"; echo "--- stdout"; cat "$RUNNER_TEMP/run.out"; echo "--- stderr"; cat "$RUNNER_TEMP/run.err"
          ruby .github/fuse_check.rb "$status" "$RUNNER_TEMP/run.out" "$GAME_NAME" "${backend[@]}"

      # test/games/fuse draws, and a runner has no GPU, and Windows' own
      # OpenGL is 1.1, which LÖVE's renderer refuses. So, as windows.yml
      # runs Lota's tests, it draws on Mesa's software OpenGL, llvmpipe,
      # from MSYS2 (UCRT64 on x64, CLANGARM64 on ARM64), set up only once
      # the app is built, so nothing of it reaches the app. windows_checks.rb
      # gathers opengl32.dll and the DLLs it needs into a folder of their
      # own, which the next step copies beside the app's program, where
      # SDL's LoadLibrary("OPENGL32.DLL") finds it before System32's.
      # setup-msys2 downloads MSYS2's base from GitHub's releases each
      # time, so a failed attempt is tried again two minutes later, as
      # windows.yml tries it.
      - id: msys2
        if: runner.os == 'Windows' && matrix.game == 'fuse'
        continue-on-error: true
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with: &msys2
          msystem: ${{ matrix.target.platform == 'x64-mingw-ucrt' && 'UCRT64' || 'CLANGARM64' }}
          path-type: inherit
          location: ${{ runner.temp }}/mesa-msys2
          pacboy: mesa:p ${{ matrix.target.platform == 'x64-mingw-ucrt' && 'binutils:p' || 'llvm-tools:p' }}
      - name: Wait before setting MSYS2 up again
        if: runner.os == 'Windows' && matrix.game == 'fuse' && steps.msys2.outcome == 'failure'
        shell: pwsh
        run: |
          Start-Sleep -Seconds 120
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\mesa-msys2" -ErrorAction SilentlyContinue
      - if: runner.os == 'Windows' && matrix.game == 'fuse' && steps.msys2.outcome == 'failure'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with: *msys2

      - name: Gather Mesa's OpenGL
        if: runner.os == 'Windows' && matrix.game == 'fuse'
        shell: msys2 {0}
        run: |
          mkdir -p "$RUNNER_TEMP/mesa"
          ruby .github/windows_checks.rb mesa "$(cygpath -m "$MINGW_PREFIX/bin")" "$(cygpath -m "$RUNNER_TEMP/mesa")"

      # With Mesa beside it, GALLIUM_DRIVER chooses llvmpipe, and LP_PERF
      # turns off its linear rasterizer, as windows.yml has its tests draw.
      - name: Run the app on Windows, with no Ruby on its PATH
        if: runner.os == 'Windows' && !inputs.game_repository
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/dist" -Filter '*.zip' | Select-Object -First 1
          $place = Join-Path $env:RUNNER_TEMP 'run\My Games'
          New-Item -ItemType Directory -Force $place | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $place
          $name = $zip.BaseName -replace "-$([regex]::Escape($env:PLATFORM))$", ''
          $program = Join-Path (Join-Path $place $zip.BaseName) "$name.exe"
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa'
          if (Test-Path -LiteralPath $mesa) { Copy-Item (Join-Path $mesa '*') (Split-Path $program) }
          $system = $env:SystemRoot
          $start = [Diagnostics.ProcessStartInfo]::new($program)
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.WorkingDirectory = $system
          $start.Environment.Clear()
          $variables = @{
            SystemRoot = $system; SystemDrive = $env:SystemDrive; windir = $system
            PATH = "$system\System32;$system;$system\System32\Wbem"
            USERPROFILE = $env:USERPROFILE; APPDATA = $env:APPDATA; LOCALAPPDATA = $env:LOCALAPPDATA
            TEMP = $env:RUNNER_TEMP; TMP = $env:RUNNER_TEMP; ALSOFT_DRIVERS = 'null'
          }
          if (Test-Path -LiteralPath $mesa) { $variables.GALLIUM_DRIVER = 'llvmpipe'; $variables.LP_PERF = 'no_rast_linear' }
          foreach ($name in $variables.Keys) { $start.Environment[$name] = $variables[$name] }
          $process = [Diagnostics.Process]::Start($start)
          $out = $process.StandardOutput.ReadToEndAsync()
          $err = $process.StandardError.ReadToEndAsync()
          if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw "$name.exe still ran after 120 s" }
          $process.WaitForExit()
          Set-Content -LiteralPath "$env:RUNNER_TEMP/run.out" -Value $out.Result -NoNewline
          Write-Host "exit status: $($process.ExitCode)"
          Write-Host "--- stdout"; Write-Host $out.Result
          Write-Host "--- stderr"; Write-Host $err.Result
          ruby .github/fuse_check.rb $process.ExitCode "$env:RUNNER_TEMP/run.out" $env:GAME_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Another repository's game draws, and a runner has no GPU and only
      # Windows' OpenGL 1.1, so on x64 Windows Mesa's software OpenGL,
      # llvmpipe, from the runner's MSYS2, goes beside the program, where
      # SDL's LoadLibrary("OPENGL32.DLL") finds it first, as Fledge's
      # Windows trial ran a Lota game. The game runs for 20 seconds; what it
      # printed, screenshots of the desktop, and any PNG it says it saved
      # are kept, since its shaders compile only once it draws. game_env's
      # variables reach it; it may run 50 seconds and quit by itself.
      - name: Draw the game with Mesa's llvmpipe
        if: inputs.game_repository && matrix.target.platform == 'x64-mingw-ucrt'
        continue-on-error: true
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-ucrt-x86_64-mesa | Out-Host
          $zip = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/dist" -Filter '*.zip' | Select-Object -First 1
          $place = Join-Path $env:RUNNER_TEMP 'draw'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $place
          $root = Join-Path $place $zip.BaseName
          $program = Get-ChildItem -LiteralPath $root -Filter '*.exe' | Select-Object -First 1
          $bin = 'C:\msys64\ucrt64\bin'
          foreach ($pattern in 'opengl32.dll', 'libgallium_wgl.dll', 'libffi-*.dll', 'libgcc_s_seh-1.dll', 'libiconv-2.dll', 'libintl-8.dll',
              'libLLVM*.dll', 'libSPIRV-Tools*.dll', 'libstdc++-6.dll', 'libsystre-0.dll', 'libtre-5.dll', 'libwinpthread-1.dll',
              'libxml2*.dll', 'libzstd.dll', 'zlib1.dll') {
            Get-ChildItem -LiteralPath $bin -Filter $pattern | ForEach-Object { Copy-Item $_.FullName $root; Write-Host "beside the program: $($_.Name)" }
          }
          $results = Join-Path $env:RUNNER_TEMP 'dist\draw'
          New-Item -ItemType Directory -Force $results | Out-Null
          $system = $env:SystemRoot
          $start = [Diagnostics.ProcessStartInfo]::new($program.FullName)
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.WorkingDirectory = $system
          $start.Environment.Clear()
          $variables = @{
            SystemRoot = $system; SystemDrive = $env:SystemDrive; windir = $system
            PATH = "$system\System32;$system;$system\System32\Wbem"
            USERPROFILE = $env:USERPROFILE; APPDATA = $env:APPDATA; LOCALAPPDATA = $env:LOCALAPPDATA
            TEMP = $env:RUNNER_TEMP; TMP = $env:RUNNER_TEMP; ALSOFT_DRIVERS = 'null'; GALLIUM_DRIVER = 'llvmpipe'
            # llvmpipe's linear rasterizer, from Mesa 25, reads the wrong uniform array and matrix elements.
            LP_PERF = 'no_rast_linear'
          }
          foreach ($name in $variables.Keys) { $start.Environment[$name] = $variables[$name] }
          foreach ($pair in ($env:GAME_ENV -split '\s+' | Where-Object { $_ })) {
            $name, $value = $pair -split '=', 2
            $start.Environment[$name] = $value
            Write-Host "game_env: $name=$value"
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $icon = [Drawing.Icon]::ExtractAssociatedIcon($program.FullName)
          $icon.ToBitmap().Save((Join-Path $results 'exe-icon.png'), [Drawing.Imaging.ImageFormat]::Png)
          Write-Host "the program's icon: $($icon.Width)x$($icon.Height), kept as exe-icon.png"
          $begun = Get-Date
          $process = [Diagnostics.Process]::Start($start)
          $out = $process.StandardOutput.ReadToEndAsync()
          $err = $process.StandardError.ReadToEndAsync()
          foreach ($second in 5, 15, 30, 45) {
            $wait = $begun.AddSeconds($second) - (Get-Date)
            if ($wait.TotalMilliseconds -gt 0) { Start-Sleep -Milliseconds $wait.TotalMilliseconds }
            if ($process.HasExited) { break }
            $bounds = [Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = [Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
            $graphics = [Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $results "desktop-$($second)s.png"), [Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose(); $bitmap.Dispose()
            if ($second -eq 5) {
              $process.Refresh()
              Write-Host "main window title: '$($process.MainWindowTitle)'"
              $process.Modules | Where-Object { $_.ModuleName -match 'opengl32|gallium|vulkan|OpenAL' } | ForEach-Object { Write-Host "loaded: $($_.FileName)" }
            }
          }
          $left = 50000 - ((Get-Date) - $begun).TotalMilliseconds
          if (-not $process.WaitForExit([Math]::Max(0, [int]$left))) { $process.Kill($true); Write-Host 'still running after 50 s: stopped' }
          $process.WaitForExit()
          Write-Host "exit status: $($process.ExitCode) after $([int]((Get-Date) - $begun).TotalSeconds) s"
          Write-Host "--- stdout"; Write-Host $out.Result
          Write-Host "--- stderr"; Write-Host $err.Result
          Set-Content -LiteralPath (Join-Path $results 'output.txt') -Value "exit status: $($process.ExitCode)`n$($out.Result)`n--- stderr`n$($err.Result)"
          foreach ($match in [regex]::Matches("$($out.Result)`n$($err.Result)", '[A-Za-z]:[\\/][^\r\n"]*?\.png')) {
            if (Test-Path -LiteralPath $match.Value) { Copy-Item -LiteralPath $match.Value $results; Write-Host "kept: $($match.Value)" }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fused-${{ matrix.game }}-${{ matrix.target.platform }}
          path: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*-setup.exe
            ${{ runner.temp }}/dist/*.dmg
            ${{ runner.temp }}/dist/*.AppImage
            ${{ runner.temp }}/dist/fuse-project/Gemfile.lock
            ${{ runner.temp }}/dist/draw
          if-no-files-found: error

  # A developer with Ruby and no compiler fuses a game with a gem to
  # compile: Ruby's own Debian image, which has no C compiler or make,
  # with only Git and the OpenGL libraries Lota loads added. lota fuse must
  # fail as Fledge compiles the gem for the app's Ruby, after the
  # compiler's output names it, and say what to install.
  no-compiler:
    name: Fuse fuse_native with no compiler (x86_64-linux-gnu)
    if: ${{ !inputs.game_repository }}
    runs-on: ubuntu-24.04
    container: ruby:4.1.0-preview1-slim@sha256:e5448d250d0a31bbda78542151dd606c7f8c4e9be5a6eeb075eb69d5ed25ea7e
    timeout-minutes: 15
    env:
      GAME: test/games/fuse_native
    steps:
      - name: Install Git and OpenGL's libraries, and no compiler
        run: |
          apt-get update
          apt-get install --assume-yes --no-install-recommends git ca-certificates curl libgl1 libegl1
          for tool in cc gcc clang make; do
            if command -v "$tool"; then echo "::error::the container has $tool"; exit 1; fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.this_run
        with:
          name: lota-x86_64-linux-gnu
          path: ${{ runner.temp }}/gems

      - name: Get Lota's gem for this platform, check it, install it, and lock the game's gems
        env:
          THIS_RUN: ${{ inputs.this_run }}
        run: |
          version=$(sed -n 's/^ *VERSION = "\(.*\)"$/\1/p' lib/lota/version.rb)
          gem="lota-$version-x86_64-linux-gnu.gem"
          gems="$RUNNER_TEMP/gems"
          mkdir -p "$gems"
          if [ "$THIS_RUN" = true ]; then
            (cd "$gems" && sha256sum --check "$gem.sha256")
          else
            release="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version"
            curl --fail --location --silent --show-error -o "$gems/$gem" "$release/$gem"
            curl --fail --location --silent --show-error -o "$gems/SHA256SUMS" "$release/SHA256SUMS"
            (cd "$gems" && grep " $gem\$" SHA256SUMS | sha256sum --check -)
          fi
          gem install --local "$gems/$gem"
          mkdir -p "$GAME/vendor/cache"
          cp "$gems/$gem" "$GAME/vendor/cache/"
          (cd "$GAME" && BUNDLE_GEMFILE="$PWD/Gemfile" bundle lock)

      - name: lota fuse fails and says what to install
        run: |
          set +e
          ruby -I lib exe/lota fuse "$GAME" --out "$RUNNER_TEMP/dist" > "$RUNNER_TEMP/fuse.out" 2> "$RUNNER_TEMP/fuse.err"
          status=$?
          set -e
          echo "exit status: $status"; echo "--- stdout"; cat "$RUNNER_TEMP/fuse.out"; echo "--- stderr"; cat "$RUNNER_TEMP/fuse.err"
          [ "$status" = 1 ] || { echo "::error::lota fuse exited with $status, not 1"; exit 1; }
          grep -F "fast_blank" "$RUNNER_TEMP/fuse.out" "$RUNNER_TEMP/fuse.err"
          grep -F "lota fuse: fledge build failed" "$RUNNER_TEMP/fuse.err"
          grep -F "A gem with a C extension compiles on this computer, which needs a C compiler" "$RUNNER_TEMP/fuse.err"
