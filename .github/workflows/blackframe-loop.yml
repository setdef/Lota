# A throwaway experiment, on the branch experiment/blackframe-loop only:
# builds as the Gate does on macos-15, then runs only the arkanoid parity
# test many times, with the parity harness's Metal watch loaded in both
# engines (ext/lota/native_test/metal_watch.mm), to learn whether a frame
# that comes back entirely black is one whose Metal command buffer failed.

name: Black frame loop (experiment)

# GitHub dispatches by hand only a workflow it knows, which it learns of
# from the default branch or from a push, so the branch's own push runs
# it once too.
on:
  push:
    branches:
      - experiment/blackframe-loop
  workflow_dispatch:
    inputs:
      iterations:
        description: How many times to run the arkanoid parity test
        default: "12"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MISE_DISABLE_TOOLS: ruby,rust
  BUNDLE_FROZEN: "true"
  LOTA_PARITY_CACHE: "0"

jobs:
  loop:
    name: Arkanoid parity loop
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Report the GUI session and the GPU
        run: |
          echo "launchctl managername is $(launchctl managername)"
          system_profiler SPDisplaysDataType || true

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11

      - name: Place Bundler and ccache outside the checkout
        id: paths
        run: |
          {
            echo "BUNDLE_PATH=$HOME/.cache/lota/bundle"
            echo "CCACHE_DIR=$HOME/.cache/lota/ccache"
          } >> "$GITHUB_ENV"
          echo "ruby=$(ruby -rdigest -e 'print RUBY_VERSION, "-", RUBY_PLATFORM, "-", Digest::SHA256.hexdigest(RbConfig::CONFIG["configure_args"])[0, 16]')" >> "$GITHUB_OUTPUT"
          echo "submodules=$(git submodule status | shasum -a 256 | cut -c 1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/bundle
          key: gems-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      - name: Fetch the source archives
        run: bundle exec rake sources:fetch

      - name: Compile through ccache
        run: |
          {
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_COMPILERCHECK=%compiler% -v"
            echo "CCACHE_MAXSIZE=2G"
            for language in C CXX OBJC OBJCXX; do echo "CMAKE_${language}_COMPILER_LAUNCHER=ccache"; done
          } >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.submodules }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Lota, the test extension, the harness's libraries, and the reference love
        run: bundle exec rake compile reference:love

      - name: Check that the Metal watch was built
        run: ls -l tmp/engine/build/lib/liblota_metal_watch.dylib

      # Each iteration runs only ArkanoidTest; LOTA_PARITY_DIAGNOSTICS names
      # the file every engine run appends its Metal watch's lines to.
      - name: Run the arkanoid parity test in a loop
        env:
          ITERATIONS: ${{ inputs.iterations || '12' }}
        run: |
          mkdir -p tmp/loop
          failures=0
          for i in $(seq 1 "$ITERATIONS"); do
            diagnostics="$PWD/tmp/loop/diagnostics-$i.txt"
            : > "$diagnostics"
            started=$(date +%s)
            if LOTA_PARITY_DIAGNOSTICS="$diagnostics" bundle exec rake test:parity \
                TESTOPTS="--name=/ArkanoidTest/ --verbose" > "tmp/loop/test-$i.log" 2>&1; then
              result=passed
            else
              result=FAILED
              failures=$((failures + 1))
            fi
            echo "::group::iteration $i: $result in $(( $(date +%s) - started )) s"
            grep -E "runs, .* assertions|Failure:|Error:|first differing frame|lota-metal-watch|Metal|MTL" "tmp/loop/test-$i.log" || true
            echo "--- Metal watch, every engine run:"
            cat "$diagnostics"
            echo "::endgroup::"
            echo "iteration $i: $result"
            grep -h "lota-metal-watch" "$diagnostics" | grep -v " 0 failed; [0-9]* waited on, 0 of them not completed" \
              | sed "s/^/iteration $i reported: /" || true
          done
          echo "$failures of $ITERATIONS iterations failed"
          echo "--- every iteration's log of a failure, whole:"
          for log in tmp/loop/test-*.log; do
            if grep -q "Failure:\|Error:" "$log"; then echo "=== $log"; cat "$log"; fi
          done
          [ "$failures" -eq 0 ]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: blackframe-loop
          path: |
            tmp/parity-mismatches
            tmp/loop
          if-no-files-found: ignore
          retention-days: 14
