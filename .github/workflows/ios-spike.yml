# The iOS spike, on experiment/ios-* branches only: SDL3 built static for
# iOS, a Lota game built with fledge build ios (Fledge 0.4.0, SDL's iOS
# host), its Xcode project built for the Simulator and, unsigned, for
# devices, and the app run in an iPad and an iPhone Simulator, with
# screenshots and its os_log kept as artifacts.
name: iOS spike

on:
  push:
    branches:
      - "experiment/ios-*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MISE_DISABLE_TOOLS: ruby,rust

jobs:
  ios:
    name: iOS Simulator
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: cmake ninja

      # Fledge's iOS runtime was built with Xcode 26.5 (its runtime/sources.yml);
      # the newest Xcode on the image builds the app.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun simctl list runtimes
          cmake --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install the bundle
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/lota/bundle" >> "$GITHUB_ENV"
          BUNDLE_PATH=$HOME/.cache/lota/bundle bundle install

      - name: Build SDL3 for iOS
        run: bundle exec rake ios:sdl3

      - name: Check the engine's iOS source list
        run: bundle exec rake engine:sources:check

      - name: Build the app with fledge build ios
        run: |
          rice=$(bundle exec ruby -e 'print Gem.loaded_specs.fetch("rice").full_gem_path')
          cd spike/ios
          export LOTA_SOURCE=$GITHUB_WORKSPACE BUNDLE_GEMFILE=$PWD/Gemfile BUNDLE_PATH=$RUNNER_TEMP/app-bundle
          export XDG_CACHE_HOME=$RUNNER_TEMP/cache
          bundle config set --local build.lota \
            "--with-lota-source=$GITHUB_WORKSPACE --with-lota-sdl3=$GITHUB_WORKSPACE/tmp/ios/sdl3 --with-rice-dir=$rice"
          sed -i "" "s|\"../..\"|\"$GITHUB_WORKSPACE\"|" Gemfile
          cat Gemfile
          bundle lock --add-platform ruby
          bundle install
          time bundle exec fledge build ios
          ls dist/LotaSpike-ios

      - name: Build the Xcode project for the Simulator and for devices
        run: |
          cd spike/ios/dist/LotaSpike-ios
          xcodebuild -project LotaSpike.xcodeproj -scheme LotaSpike -configuration Debug -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/derived" build CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/xcodebuild-sim.log" 2>&1 \
            || { tail -80 "$RUNNER_TEMP/xcodebuild-sim.log"; exit 1; }
          grep -E "warning:|BUILD" "$RUNNER_TEMP/xcodebuild-sim.log" | sort | uniq -c | head -40
          xcodebuild -project LotaSpike.xcodeproj -scheme LotaSpike -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/derived" build CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/xcodebuild-device.log" 2>&1 \
            || { tail -80 "$RUNNER_TEMP/xcodebuild-device.log"; exit 1; }
          grep -E "warning:|BUILD" "$RUNNER_TEMP/xcodebuild-device.log" | sort | uniq -c | head -40
          app=$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/LotaSpike.app
          ls -la "$app"
          xcrun vtool -show-build "$app/LotaSpike" | head -12
          du -sh "$app" "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/LotaSpike.app"

      - name: Run the app in the iOS Simulator
        run: |
          ruby spike/ios/simulator.rb "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/LotaSpike.app" \
            com.kerricklong.lota.LotaSpike LotaSpike "$RUNNER_TEMP/simulator"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-spike
          path: |
            ${{ runner.temp }}/simulator
            ${{ runner.temp }}/xcodebuild-*.log
          retention-days: 14
