# The Ruby .github/windows_ruby.env pins for this runner's architecture,
# RubyInstaller's head build as Fledge's release keeps it, checked by its
# SHA-256 and its ruby_version (.github/windows_ruby.sh), put first on the
# PATH. It takes the place of setup-ruby's Ruby, which for head is
# whatever RubyInstaller built last, and whose ABI can differ from the
# Ruby a fused app runs (ADR 013). It names the MSYS2 MINGW bin folder
# the caller gives in RUBY_DLL_PATH, where RubyInstaller's runtime finds
# the zlib1.dll the head build does not carry.
name: Set up the pinned Windows Ruby
description: RubyInstaller's head build at the SHA-256 windows_ruby.env pins, first on the PATH

inputs:
  dll_path:
    description: The MSYS2 MINGW bin folder, in Windows' form, that RubyInstaller's runtime loads missing DLLs from
    required: true

runs:
  using: composite
  steps:
    - name: Fetch, check, and unpack the pinned Ruby
      shell: bash
      env:
        DLL_PATH: ${{ inputs.dll_path }}
      run: |
        case "$RUNNER_ARCH" in
          X64) arch=x64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::no Windows Ruby is pinned for $RUNNER_ARCH"; exit 1 ;;
        esac
        bin=$(bash "$GITHUB_WORKSPACE/.github/windows_ruby.sh" "$arch" "$(cygpath -u "$RUNNER_TEMP")/windows-ruby")
        cygpath -w "$bin" >> "$GITHUB_PATH"
        echo "RUBY_DLL_PATH=$DLL_PATH" >> "$GITHUB_ENV"
        "$bin/ruby.exe" -v
