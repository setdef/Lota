# mise compiles Ruby with ruby-build rather than installing jdx/ruby's
# precompiled build, whose macOS Ruby has no ZJIT, which rake bench
# measures. Ruby's configure builds ZJIT only with Rust 1.85 or newer
# (configure.ac, "prerequisites for ZJIT"), and when it is not asked to,
# quietly leaves it out; --enable-zjit makes an install without that Rust
# fail instead.
[settings.ruby]
compile = true
ruby_build_opts = "--enable-yjit --enable-zjit"

# depends installs the Rust in [tools] before Ruby and puts it on the PATH
# ruby-build compiles with; without it, both install at once and
# ruby-build sees no Rust from mise. It is set here, under a quoted key,
# rather than as a table in [tools], because ruby/setup-ruby, which reads
# CI's Ruby version from this file, takes the first line of the form
# ruby = "4.0.7" anywhere in it, and nothing else.
[tool_alias]
"ruby" = "core:ruby[depends=rust]"

[tools]
ruby = "4.0.7"
rust = { version = "1.99.1", profile = "minimal" }
python = "3.12"
pre-commit = "latest"
cmake = "4.3.2"
ninja = "1.13.2"
# clang-format and clang-tidy come from LLVM's PyPI wheels, which mise
# installs with uv.
uv = "0.13.4"
"pipx:clang-format" = "23.1.3"
"pipx:clang-tidy" = "23.1.3"
# The REUSE tool checks licensing (rake reuse:lint). charset-normalizer, pure
# Python, detects file encodings without libmagic, which python-magic needs.
"pipx:reuse" = { version = "6.2.0", extras = "charset-normalizer" }
# actionlint checks .github/workflows in the gate (rake lint:workflows), with
# shellcheck checking each step's script; ccache lets CI reuse compiled
# objects between runs (.github/workflows/ci.yml).
actionlint = "1.7.12"
shellcheck = "0.11.0"
ccache = "4.14.2"
# patchelf points the Linux gem's libraries at each other
# (tasks/native_format.rb), as LÖVE's AppImage build does; macOS's
# install_name_tool comes with Xcode.
"github:NixOS/patchelf" = { version = "0.18.0", os = ["linux"] }
