# OpenAL Soft's settings for the games rake package:install and
# package:deliver run from the installed gem (tasks/package_check.rb, which
# names this file in ALSOFT_CONF). Every Source plays through the null
# backend, which opens a device that plays nothing, so a check's run makes
# no sound and needs no audio device, as on a CI runner, while the gem's
# OpenAL Soft still loads and opens. Its mixer thread asks for no real-time
# priority (rt-prio = 0), which OpenAL Soft would otherwise ask the system
# for, through RTKit on Linux, and report as an error where RTKit is
# missing, as on a bare CI runner (OpenAL Soft 1.24.3, alc/alc.cpp:516 and
# core/helpers.cpp:499-501); a check's run then prints only what its game
# prints.

[general]
drivers = null
rt-prio = 0
