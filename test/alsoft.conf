# OpenAL Soft's settings for Lota's tests and the parity harness, which
# test/test_helper.rb and test/parity/parity_helper.rb name in ALSOFT_CONF,
# as LÖVE's own CI names vendor/love/testing/resources/alsoft.conf for
# Lövetest (vendor/love/.github/workflows/main.yml): every Source plays into
# OpenAL Soft's wave file writer instead of the computer's speakers, so the
# tests play the same way on a computer with an audio device and on a CI
# runner without one, and make no sound. The file goes in the run's own
# home (CFFIXED_USER_HOME), never into the working directory, where LÖVE's
# settings put it. The parity harness's runs open a loopback device in
# its place (ext/lota/native_test/loopback.cpp), which mixes on game time.

[general]
drivers = wave

[wave]
file = $CFFIXED_USER_HOME/alsoft.wav
