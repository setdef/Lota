inherit_from:
  - ./vendor/goodcop/base.yml

AllCops:
  TargetRubyVersion: "4.0"
  Exclude:
    # Build staging directory
    - "tmp/**/*"
    # The pinned LÖVE source is C++ and Lua, and not ours to lint
    - "vendor/love/**/*"
    # LÖVE's prebuilt macOS dependencies, likewise not ours
    - "vendor/love-apple-dependencies/**/*"
    # The Makefile LÖVE's Linux CI builds its dependencies with, and what
    # it downloads (tasks/linux_build.rb), likewise not ours
    - "vendor/love-appimage-source/**/*"
    - "vendor/sources/**/*"
    # Fixture games, pinned submodules of other people's code, which the
    # parity harness runs unchanged (Plan 001)
    - "test/fixtures/**/*"
# RDoc mis-parses endless methods: the methods after one lose their comments
# and visibility (doc/contributors/documentation_style.md, section 5). Every
# file RDoc reads uses def ... end.
Style/EndlessMethod:
  Enabled: true
  EnforcedStyle: disallow
  Include:
    - "lib/**/*.rb"
    - "ext/**/*.rb"
    - "examples/**/*.rb"
